<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE ZERO 2.0 · Orlické vraždy</title><style>
:root{color-scheme:dark;--bg:#0c1419;--panel:#18252d;--line:#354650;--gold:#e4bb78;--muted:#a5b4bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eaf0ed;font:15px/1.55 system-ui,-apple-system,sans-serif}header{padding:16px 18px;background:#101d25;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}header b{letter-spacing:.18em;color:var(--gold)}main{max-width:700px;margin:auto;padding:20px 15px 100px}h1,h2{font-family:Georgia,serif;line-height:1.22}h1{font-size:32px}h2{font-size:23px}p{margin:10px 0}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:750}.card{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:14px;margin:14px 0}.hero{background:linear-gradient(145deg,#283f4c,#101c24);padding:25px 20px;border-radius:15px;border:1px solid #52616b}.desk{min-height:220px;background:radial-gradient(ellipse at 30% 10%,#3b4d4a,#18252d 75%);padding:20px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#e0d2ad;color:#28302f;transform:rotate(-2deg);padding:15px 10px;box-shadow:0 5px 12px #0005;min-height:100px;border-radius:3px;text-align:left;font:inherit;border:0}.item:nth-child(even){transform:rotate(2deg);background:#b5c6c7}.item small{display:block;font-size:11px;margin-top:8px}button{font:inherit;cursor:pointer}.action{display:block;width:100%;padding:13px 15px;background:#293c46;color:#f1f4f2;border:1px solid #637681;border-radius:9px;text-align:left;margin:8px 0}.action:disabled{opacity:.4;cursor:default}.action.gold{background:var(--gold);color:#19252b;border-color:var(--gold);font-weight:700}.action.selected{border-color:var(--gold);background:#3c3b31}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101b22;border-top:1px solid var(--line);padding:8px max(8px,calc((100vw - 700px)/2));z-index:5}.nav button{flex:1;background:transparent;color:#b9c5c9;border:0;padding:8px 1px;font-size:11px}.nav button.active{color:var(--gold)}.nav span{display:block;font-size:21px}.notice{border-left:3px solid var(--gold);padding:10px 14px;background:#302e25}.chat{padding:12px;background:#23353e;border-radius:12px;margin:10px 0}.chat b{color:var(--gold)}.tag{display:inline-block;padding:4px 8px;border:1px solid #526a72;border-radius:20px;font-size:12px;margin:3px}.paper{background:#d8d0b9;color:#252a28;padding:22px 18px;box-shadow:0 5px 14px #0006;transform:rotate(-.4deg)}.paper h2{color:#262c29}.paper .muted{color:#525b58}.line{border-bottom:1px solid var(--line);padding:10px 0}.ok{color:#a4d7bd}.warn{color:#efc58c}a{color:var(--gold)}.paper a{color:#3b514c}input{width:100%;padding:13px;background:#0d1a21;color:white;border:1px solid #6c808a;border-radius:8px;font:inherit}details{margin-top:15px}summary{cursor:pointer}
 .nav button{font-size:12px}.action{min-height:48px}</style></head><body><header><b>CASE ZERO <small style="font-weight:400;letter-spacing:0">2.0</small></b><span>SPIS 007 · 1995</span></header><main id="app"></main><nav class="nav" id="nav"></nav>
<script>
const KEY='casezero_orlik_v2';
const ITEMS={
report:{title:'Hlášení o pohřešování',type:'Úřední záznam',body:'Případy několika pohřešovaných osob se vracejí na stůl kriminalistů. Některé osoby spojují obchodní a osobní vazby. Samotné zmizení ještě není důkazem vraždy.',kind:'reconstruction'},
timeline:{title:'Časové souvislosti',type:'Pracovní chronologie',body:'Prokázané vraždy spadají do let 1991 až 1993. K propojení případů je nutné ověřit jednotlivé události, ne jen předpokládat společného pachatele.',kind:'fact'},
names:{title:'Okruh osob',type:'Prověřovací seznam',body:'V historickém případu figurovali Karel Kopáč, Ludvík Černý, Vladimír Kuna, Petr Chodounský a Irena Meierová. Jejich role se lišily a nelze je zaměňovat.',kind:'fact'},
water:{title:'Orlická přehrada',type:'Zpráva o pátrání',body:'V červenci 1995 byly při pátrání na dně Orlické přehrady nalezeny ostatky obětí. Nález se stal zásadním zlomem vyšetřování.',kind:'fact'},
victims:{title:'Pět obětí',type:'Přehled zjištění',body:'Soudně prokázaná série zahrnovala pět vražd. Oběťmi byli Aleš Katovský, Leorent Lipoveci, Anna Medková, Vlastimil Hodr a Jaroslav Meier.',kind:'fact'},
verdict:{title:'Soudní spis',type:'Historický výsledek',body:'V roce 1997 byli pachatelé odsouzeni k rozdílným trestům. Ludvík Černý dostal doživotí; ostatní dostali časově omezené tresty podle své role.',kind:'fact'}
};
const CALLS=[
{from:'Operační důstojník',text:'Máme několik zmizení a nejasné vazby mezi lidmi. Co mám přednostně zajistit?',opts:[['Vyžádat přehled zmizení a časových souvislostí','timeline'],['Prověřit osoby a jejich vztahy','names']]},
{from:'Kolega z vyšetřování',text:'Přibyla informace o možném spojení případů. Chceš se zaměřit na svědectví a osoby, nebo na pátrání po hmotných stopách?',opts:[['Prověřit seznam obětí','victims'],['Zaměřit pátrání na Orlickou přehradu','water']]},
{from:'Vedoucí týmu',text:'Máme výsledky pátrání. Než předložíme závěr, musíš odlišit prokázané činy od pouhého podezření.',opts:[['Připravit důkazní rozbor','analysis'],['Vrátit se k materiálům','files']]}
];
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}s||={view:'desk',seen:['report'],call:0,choices:[],links:[],notes:'',conclusion:null,finished:false};s.seen ||= ['report'];s.links ||= [];s.choices ||= [];s.view ||= 'desk';
const PAIRS=[['timeline','victims','Propojení časové osy s oběťmi pomáhá rozlišit samostatná zmizení od série prokázaných vražd.'],['names','water','Hmotné stopy z přehrady lze zasadit do souvislostí s prověřovanými osobami.'],['water','victims','Nález ostatků je zásadní pro potvrzení osudu obětí.']];
const app=document.getElementById('app'),nav=document.getElementById('nav');function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function go(v){s.view=v;save();draw();scrollTo(0,0)}
function openItem(id){if(!s.seen.includes(id))s.seen.push(id);s.reportOpened ||= id==='report';go('item:'+id)}
function pick(i){let c=CALLS[s.call];if(!c)return;let dest=c.opts[i][1];s.choices.push({call:s.call,choice:i});s.call++;if(ITEMS[dest]){if(!s.seen.includes(dest))s.seen.push(dest);go('item:'+dest)}else go(dest)}
function connect(a,b){if(a===b)return;let pair=PAIRS.find(p=>(p[0]===a&&p[1]===b)||(p[1]===a&&p[0]===b));if(!pair){s.lastLink='Tyto dvě informace zatím nemají doloženou přímou souvislost. Zkus jiné propojení.'}else if(!s.seen.includes(a)||!s.seen.includes(b)){s.lastLink='Nejprve musíš získat oba podklady.'}else{let id=pair[0]+'-'+pair[1];if(!s.links.includes(id))s.links.push(id);s.lastLink=pair[2]}save();draw()}
function boardTap(k){if(!s.boardFirst){s.boardFirst=k;s.lastLink='';save();draw();return}if(s.boardFirst===k){s.boardFirst=null;save();draw();return}let a=s.boardFirst;s.boardFirst=null;connect(a,k)}
function resolve(){let v=document.getElementById('theory')?.value||'';s.notes=v;s.conclusion=document.querySelector('input[name=conclusion]:checked')?.value||null;save();draw()}
function finish(){if(s.links.length<2||!s.conclusion)return;s.finished=true;go('ending')}
function btn(t,fn,cl=''){return '<button class="action '+cl+'" onclick="'+fn+'">'+t+'</button>'}
function desk(){let c=CALLS[s.call],missing=['timeline','names','victims','water'].filter(k=>!s.seen.includes(k));if(s.call===0&&!s.reportOpened)return '<div class="hero"><div class="eyebrow">PRAHA · ČERVENEC 1995</div><h1>Nový případ</h1><p>Na stole leží hlášení o pohřešovaných osobách. Zatím není jasné, jestli spolu souvisejí.</p></div>'+btn('Otevřít první hlášení',"openItem('report')",'gold');return '<div class="eyebrow">KANCELÁŘ · ORLICKÉ VRAŽDY</div>'+(c?'<div class="card"><div class="eyebrow">● TELEFONÁT · '+(s.call+1)+'/3</div><h2>'+c.from+'</h2><p>„'+c.text+'“</p>'+c.opts.map((o,i)=>btn(o[0],'pick('+i+')')).join('')+'</div>':'<div class="card"><div class="eyebrow">DALŠÍ POSTUP</div><h2>Co chceš prověřit?</h2><p>Prostuduj další materiály a pokus se najít vazby mezi událostmi.</p>'+(missing.length?missing.map(k=>btn('Vyžádat: '+ITEMS[k].title,"openItem('"+k+"')")).join(''):btn('Přejít na tabuli souvislostí',"go('board')",'gold'))+'</div>')+'<div class="card"><div class="eyebrow">NA TVÉM STOLE · '+s.seen.length+' PODKLADŮ</div>'+s.seen.filter(k=>k!=='verdict').map(k=>btn('📄 '+ITEMS[k].title,"openItem('"+k+"')")).join('')+'</div>'}
function item(id){let d=ITEMS[id];return '<div class="eyebrow">OTEVŘENÝ PODKLAD · '+d.type.toUpperCase()+'</div><div class="paper"><h2>'+d.title+'</h2><p>'+d.body+'</p><p class="muted" style="font-size:12px">'+(d.kind==='fact'?'Historické shrnutí veřejně doložených informací.':'Herní rekonstrukce, nikoli autentický policejní dokument.')+'</p></div>'+btn('Vrátit na vyšetřovací stůl',"go('desk')",'gold')+btn('Přejít na tabuli souvislostí',"go('board')")}
function files(){return '<h1>Spisovna</h1><p class="muted">Dokumenty, které už byly získány při vyšetřování.</p>'+Object.keys(ITEMS).filter(k=>s.seen.includes(k)&&k!=='verdict').map(k=>'<div class="card"><div class="eyebrow">'+ITEMS[k].type+'</div><h2>'+ITEMS[k].title+'</h2>'+btn('Otevřít','openItem(\''+k+'\')')+'</div>').join('')}
function board(){let found=Object.keys(ITEMS).filter(k=>s.seen.includes(k)&&k!=='verdict');let chosen=s.boardFirst;return '<div class="eyebrow">VYŠETŘOVACÍ TABULE</div><h1>Co spolu souvisí?</h1><p>'+(chosen?'Teď klepni na druhý podklad, který chceš s prvním propojit.':'Klepni na první podklad a potom na druhý. Žádné rozbalovací seznamy.')+'</p><div class="card"><div class="eyebrow">DOSTUPNÉ STOPY</div>'+found.map(k=>btn((chosen===k?'✓ ':'📄 ')+ITEMS[k].title,"boardTap('"+k+"')",chosen===k?'selected':'')).join('')+(chosen?btn('Zrušit výběr',"boardTap('"+chosen+"')"):'')+'</div>'+(s.lastLink?'<div class="card"><p>'+s.lastLink+'</p></div>':'')+(s.links.length?'<div class="card"><h2>Potvrzené souvislosti</h2>'+s.links.map(k=>{let p=PAIRS.find(x=>x[0]+'-'+x[1]===k);return '<p class="line ok">✓ '+ITEMS[p[0]].title+' ↔ '+ITEMS[p[1]].title+'</p>'}).join('')+'</div>':'')+(s.links.length>=2?btn('Připravit závěrečnou zprávu',"go('analysis')",'gold'):'<p class="muted">Doložené vazby: '+s.links.length+'/2 potřebných pro závěr.</p>')}
function analysis(){return '<h1>Vlastní rekonstrukce</h1><div class="card"><h2>Co se podle tebe stalo?</h2><p>Sepiš stručně vlastní verzi. V závěrečné zprávě zůstane zachovaná pro porovnání se skutečností.</p><textarea id="theory" style="width:100%;min-height:110px;background:#0c1920;color:white;padding:12px;border:1px solid #6c808a;border-radius:8px;font:inherit" placeholder="Jak spolu případy souvisejí? Jaké důkazy to podporují?">'+(s.notes||'')+'</textarea><h2>Co lze nyní tvrdit?</h2>'+[['group','Prokázaná série zahrnuje více vražd a více pachatelů.'],['single','Šlo o jedinou nešťastnou náhodu bez cizího zavinění.'],['unknown','Nelze doložit žádnou souvislost mezi zmizeními.']].map(o=>'<label class="action"><input type="radio" name="conclusion" value="'+o[0]+'" '+(s.conclusion===o[0]?'checked':'')+' style="width:auto;margin-right:8px">'+o[1]+'</label>').join('')+btn('Uložit pracovní závěr','resolve()','gold')+'</div><div class="card"><h2>Uzavření spisu</h2><p>Pro závěr potřebuješ alespoň dvě doložené vazby a vlastní vyhodnocení.</p>'+btn('Otevřít historické rozuzlení','finish()',s.links.length>=2&&s.conclusion?'gold':'')+'</div>'}
function ending(){return '<div class="hero"><div class="eyebrow">SKUTEČNÝ HISTORICKÝ VÝSLEDEK</div><h1>Orlické vraždy</h1><p>Prokázaná série zahrnovala pět vražd spáchaných v letech 1991–1993. Zlom přinesly nálezy ostatků v Orlické přehradě v roce 1995.</p></div><div class="card"><h2>Co ukázalo vyšetřování</h2><p>Na zločinech se podílela skupina osob s rozdílnými rolemi. V roce 1997 padly odsuzující rozsudky. Ludvík Černý dostal doživotní trest; další obžalovaní dostali odlišné tresty.</p><h2>Tvoje verze</h2><p>'+(s.notes?escapeHtml(s.notes):'Bez písemné rekonstrukce.')+'</p><p>'+ (s.conclusion==='group'?'✓ Tvoje hlavní hypotéza odpovídá doloženému výsledku.':'Tvoje hlavní hypotéza se liší od historického výsledku.')+'</p><p>Potvrzené vazby: '+s.links.length+' ze 3.</p><h2>Prameny</h2><p><a href="https://www.irozhlas.cz/veda-technologie_historie/pred-20-lety-nasli-potapeci-hrbitov-na-dne-prehrady-nastal-zlom-v-kauze-orlickych-vrahu_201507141624_lkrejcarova" target="_blank" rel="noopener">Český rozhlas: nález v přehradě ↗</a></p><p class="muted">Herní telefonáty a kancelář jsou fikční rekonstrukce. Historické události a výsledek se nemění.</p></div>'+btn('Vrátit se k důkazům',"go('desk')")}
function escapeHtml(t){return t.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function draw(){let v=s.view;app.innerHTML=(v==='desk'?desk():v.startsWith('item:')?item(v.slice(5)):v==='files'?files():v==='board'?board():v==='analysis'?analysis():ending())+'<details class="card"><summary>O hře a restart</summary><p class="muted">Toto je hratelný prototyp CASE ZERO 2.0. Dialogy, oznámení a kancelář jsou herní rekonstrukce, nikoli autentické výslechy. Historická fakta ověřuj v uvedených pramenech.</p>'+btn('Restartovat případ','restart()')+'<a href="./index.html">Zpět do knihovny</a></details>';nav.innerHTML=[['desk','⌂','Kancelář'],['files','▤','Spisy'],['board','◎','Vazby']].map(x=>'<button class="'+(v===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')}
function restart(){if(confirm('Opravdu začít nový pokus?')){localStorage.removeItem(KEY);location.reload()}}draw();
</script></body></html>
