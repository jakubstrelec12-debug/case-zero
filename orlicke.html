<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE ZERO · Orlické vraždy · vyšetřovací verze 3</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1419;color:#f1f0e9;font:16px/1.65 system-ui,-apple-system,sans-serif}header{height:62px;padding:16px 20px;border-bottom:1px solid #34434b;background:#101b22;display:flex;justify-content:space-between;align-items:center}header b{color:#e8c184;letter-spacing:.16em}main{max-width:630px;margin:0 auto;padding:26px 20px 100px}.eyebrow{color:#e8c184;font-size:12px;letter-spacing:.14em;font-weight:700}h1{font:34px/1.18 Georgia,serif;margin:12px 0 18px}h2{font:24px Georgia,serif}.scene{min-height:230px;background:linear-gradient(155deg,#253843,#101a20);border:1px solid #3a505a;border-radius:15px;padding:24px 21px;margin:18px 0}.scene p{margin:0 0 15px}.speech{border-left:3px solid #e8c184;padding:12px 16px;background:#293942;margin:18px 0;font-style:italic}.choice{display:block;width:100%;text-align:left;background:#1b2b35;color:#f0f2ef;border:1px solid #536670;border-radius:10px;padding:16px;margin:10px 0;font:inherit;min-height:54px}.choice:active{background:#42545a}.primary{background:#e8c184;color:#1c2428;border-color:#e8c184;font-weight:700}.muted{color:#b1c0c5;font-size:14px}.evidence{background:#d8d1bb;color:#222b2d;padding:22px;margin:20px 0;border-radius:3px;box-shadow:0 7px 24px #0007;transform:rotate(-.5deg)}.evidence h2{margin-top:6px}.line{border-top:1px solid #3c4d55;padding-top:16px;margin-top:16px}.progress{height:3px;background:#2b3a40;margin:0}.progress div{height:100%;background:#e8c184;transition:width .3s}.bottom{position:fixed;bottom:0;left:0;right:0;background:#101b22;border-top:1px solid #34434b;padding:12px 20px;text-align:center;color:#a8b9c1;font-size:12px}.ok{color:#a9e2c0}.pill{display:inline-block;border:1px solid #5a6d76;border-radius:30px;padding:4px 11px;font-size:12px;margin:4px 4px 4px 0}.note{padding:14px;background:#2a2b26;border-left:3px solid #e8c184;font-size:14px}a{color:#e8c184}textarea{width:100%;min-height:115px;background:#101b22;border:1px solid #71828a;border-radius:8px;color:white;font:inherit;padding:12px}details{margin-top:40px;color:#b3c0c5;font-size:13px}summary{cursor:pointer}
</style></head><body><header><b>CASE ZERO</b><span style="font-size:12px;color:#a7b6bc">SPIS 007 · V4</span></header><div class="progress"><div id="bar"></div></div><main id="game"></main><div class="bottom" id="status"></div><script>
const KEY='casezero_orlik_firstperson_v4';
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s)s={step:0,flags:{},path:[],note:'',solved:false};s.flags ||= {};s.path ||= [];s.inferences ||= {};s.reportParts ||= {};
const scenes=[
{where:'PRAHA · KRIMINÁLNÍ POLICIE · LÉTO 1995',title:'Začíná tvoje vyšetřování',story:'Sedíš ve své kanceláři v roce 1995. Kolega vstoupí a položí před tebe složku označenou „Pohřešovaní“. Tentokrát budeš muset sám posoudit důkazy a na konci sestavit zprávu z vybraných závěrů.',voice:'„Máme několik zmizení. Něco mi na těch případech nesedí. Potřebuju, aby ses na ně podíval.“',choices:[['Zeptám se, co ho znepokojuje','question'],['Otevřu složku a začnu číst','read']]},
{where:'KANCELÁŘ · PRVNÍ INFORMACE',title:'Nejasná zmizení',story:'Kolega zůstává stát u stolu. Přehled událostí zatím neukazuje jasnou souvislost. Víš jen, že někteří pohřešovaní měli obchodní a osobní vazby.',voice:'„Nechci tvrdit, že jde o jednu věc. Ale některé okolnosti stojí za prověření.“',choices:[['Nejdřív sestavím časovou osu','time'],['Prověřím kontakty pohřešovaných','people']]},
{where:'KANCELÁŘ · PRACOVNÍ ZÁZNAM',title:'Časová osa',story:'Procházíš starší záznamy z let 1991 až 1993. Několik lidí zmizelo za nejasných okolností. Zatím nemáš důkaz, že všechna zmizení spolu souvisejí.',evidence:['PRACOVNÍ CHRONOLOGIE','1991–1993: vybraná hlášení o pohřešovaných osobách. Příčiny zmizení se prověřují.','Historický údaj; podoba dokumentu je herní rekonstrukcí.'],choices:[['Zaměřím se na společné kontakty','people'],['Požádám kolegu o další zjištění','follow']]},
{where:'KANCELÁŘ · PROVĚŘOVÁNÍ',title:'Okruh osob',story:'Kolega přináší jména osob, jejichž kontakty a výpovědi chce tým prověřit. Zápis sám o sobě nikoho neusvědčuje.',evidence:['PROVĚŘOVANÉ OSOBY','Karel Kopáč, Ludvík Černý, Vladimír Kuna, Petr Chodounský a Irena Meierová. Jejich vztahy a případná účast se teprve prověřují.','Jména vycházejí z historické kauzy; seznam není autentický dobový dokument.'],choices:[['Prověřím, co se stalo s pohřešovanými','follow'],['Porovnám jejich vazby s časovou osou','time']]},
{where:'KANCELÁŘ · NOVÁ INFORMACE',title:'Stopa vede k přehradě',story:'Do kanceláře přichází naléhavá zpráva od pátracího týmu u Orlické přehrady. Potápěči našli něco, co může vyšetřování zásadně změnit.',voice:'„Teď už potřebujeme každé tvrzení podložit. Nestačí jen podezření.“',choices:[['Chci vědět, co nálezy skutečně prokazují','water'],['Nejdřív porovnám seznam obětí','victims']]},
{where:'PÁTRACÍ ZPRÁVA · ORLICKÁ PŘEHRADA',title:'Hmotný důkaz',story:'Je červenec 1995. Potápěči z přehrady vyzvedli lidské ostatky. Musíš zjistit, ke kterým pohřešovaným patří a co jejich nález dokazuje.',evidence:['VÝSLEDEK PÁTRÁNÍ','Orlická přehrada, červenec 1995: nalezeny lidské ostatky. Identifikace a souvislosti jsou předmětem vyšetřování.','Shrnutí doložené události, nikoli kopie policejního protokolu.'],choices:[['Porovnám nález se známými oběťmi','victims'],['Připravím předběžný závěr','deduction']]},
{where:'KANCELÁŘ · SOUHRN OBĚTÍ',title:'Pět životů',story:'Před sebou máš pět jmen. Zjišťuješ, zda nalezené stopy souvisejí s jejich zmizením. Každý případ je nutné doložit zvlášť.',evidence:['OSOBY V PROVĚŘOVANÝCH PŘÍPADECH','Aleš Katovský, Leorent Lipoveci, Anna Medková, Vlastimil Hodr a Jaroslav Meier.','Jména jsou historická. Podoba tohoto pracovního seznamu je herní rekonstrukcí.'],choices:[['Vysvětlím si vztah mezi oběťmi a nálezy','deduction'],['Znovu prověřím hmotný důkaz','water']]},
{where:'KANCELÁŘ · TVŮJ ÚSUDEK',title:'Co už lze doložit?',story:'Je léto 1995. Na základě dosavadních stop musíš rozhodnout, kterou pracovní verzi podpoříš. Soudní výsledek ještě neexistuje.',choices:[['Nálezy a vazby ukazují na více propojených vražd','correct'],['Všechna zmizení byla jistě nehody','wrong'],['Všichni prověřovaní měli totožnou roli','wrong']]},
{where:'KANCELÁŘ · POSLEDNÍ ZÁZNAM',title:'Tvoje vyšetřovací zpráva',story:'Sepiš pracovní zprávu pro vedoucího vyšetřování. Zatím jsi v roce 1995; až po odevzdání uvidíš epilog s pozdějším soudním výsledkem.',assemble:true,choices:[['Odevzdat sestavenou zprávu','ending']]},
{where:'EPILOG · PRAHA · 1997',title:'Co se skutečně stalo',story:'Série pěti vražd z let 1991 až 1993 byla objasněna. Nálezy v Orlické přehradě v roce 1995 významně přispěly k usvědčení pachatelů. V roce 1997 padly odsuzující rozsudky; Ludvík Černý dostal doživotí, další odsouzení rozdílné tresty.',end:true}
];
const flow={question:1,read:1,time:2,people:3,follow:4,water:5,victims:6,deduction:7,correct:8,wrong:8,ending:9};
const INFERENCES=[
{title:'Co dokazují záznamy o zmizeních?',docs:['Hlášení: několik osob se pohřešuje.','Chronologie: záznamy spadají do různých let.'],options:['Samotná časová blízkost ještě nedokazuje společného pachatele.','Všichni pohřešovaní byli určitě zavražděni jednou osobou.','Jde určitě o nehody.'],correct:0,explain:'Správně: samotná zmizení a časová osa nejsou důkazem společného pachatele.'},
{title:'Co lze vyvodit z nálezu u přehrady?',docs:['Pátrací tým: z vody byly vyzvednuty lidské ostatky.','Spisy: několik osob je nadále vedeno jako pohřešovaných.'],options:['Nález automaticky usvědčuje všechny prověřované osoby.','Je třeba odborně ověřit totožnost ostatků a spojení s jednotlivými případy.','Nález nemůže s pohřešováním souviset.'],correct:1,explain:'Správně: identifikace a vazba na konkrétní případ jsou nezbytné.'},
{title:'Jak pracovat s prověřovanými osobami?',docs:['Seznam: několik osob s různými kontakty.','Dosavadní informace: role jednotlivců zatím nejsou prokázány.'],options:['Každému přisoudit stejnou vinu.','Bez dalšího prověřování všechny vyloučit.','Ověřovat konkrétní roli každé osoby samostatně.'],correct:2,explain:'Správně: odpovědnost musí být podložena individuálními důkazy.'}
];
const REPORT=[
{title:'Charakter událostí',options:['Několik případů vyžaduje společné prověření, souvislost není automatická.','Všechny případy jsou prokazatelně nehody.','Časová osa sama usvědčuje pachatele.'],correct:0},
{title:'Klíčový důkazní směr',options:['Přestat pátrat po pohřešovaných.','Identifikace nalezených ostatků a porovnání s jednotlivými spisy.','Nález nepotřebuje žádné odborné ověření.'],correct:1},
{title:'Další postup vůči osobám',options:['Všem automaticky přisoudit stejný čin.','Případ ihned uzavřít bez prověřování.','Samostatně ověřit vztahy, jednání a důkazy u každé osoby.'],correct:2}
];
function infer(i,j){s.inferences[i]=j;save();draw()}
function reportPart(i,j){s.reportParts[i]=j;save();draw()}
function puzzle(){return '<div class="eyebrow">DŮKAZNÍ ROZBOR · LÉTO 1995</div><h1>Teď rozhodují důkazy</h1><p>Nestačí jen kliknout na další scénu. Porovnej informace a sám vyvoď, co z nich skutečně plyne.</p>'+INFERENCES.map((x,i)=>'<div class="scene"><div class="eyebrow">ROZBOR '+(i+1)+'/3</div><h2>'+x.title+'</h2>'+x.docs.map(d=>'<p class="note">'+d+'</p>').join('')+x.options.map((o,j)=>'<button class="choice '+(s.inferences[i]===j?'primary':'')+'" onclick="infer('+i+','+j+')">'+o+'</button>').join('')+(s.inferences[i]!==undefined?'<p class="'+(s.inferences[i]===x.correct?'ok':'muted')+'">'+(s.inferences[i]===x.correct?'✓ '+x.explain:'Tento závěr není dostatečně podložený. Zkus porovnat oba podklady znovu.')+'</p>':'')+'</div>').join('')+(Object.keys(s.inferences).length===3?'<button class="choice primary" onclick="advance()">Předat důkazní rozbor vedoucímu</button>':'<p class="muted">Vyhodnoceno '+Object.keys(s.inferences).length+'/3</p>')}
function advance(){s.step=8;save();draw();window.scrollTo(0,0)}
function reportUI(){return '<div class="eyebrow">PRACOVNÍ ZPRÁVA · 1995</div><h1>Sestav vyšetřovací závěr</h1><p>Vyber formulace, které chceš skutečně předložit vedoucímu. Zpráva se sestaví automaticky, nic nemusíš psát.</p>'+REPORT.map((x,i)=>'<div class="scene"><div class="eyebrow">ODDÍL '+(i+1)+'/3</div><h2>'+x.title+'</h2>'+x.options.map((o,j)=>'<button class="choice '+(s.reportParts[i]===j?'primary':'')+'" onclick="reportPart('+i+','+j+')">'+o+'</button>').join('')+'</div>').join('')+(Object.keys(s.reportParts).length===3?'<div class="note"><strong>Hotová zpráva</strong>'+REPORT.map((x,i)=>'<p>• '+x.options[s.reportParts[i]]+'</p>').join('')+'</div><button class="choice primary" onclick="choose(0)">Odevzdat zprávu a zobrazit epilog</button>':'<p class="muted">Vyplněno '+Object.keys(s.reportParts).length+'/3 oddílů.</p>')}

function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function choose(i){const sc=scenes[s.step],ch=sc.choices[i];if(sc.assemble&&Object.keys(s.reportParts).length<3){alert('Nejdřív sestav všechny tři části zprávy.');return}s.path.push(ch[1]);s.flags[ch[1]]=true;let next=flow[ch[1]];
// Jednosměrný průchod: opakované prověřování nikdy nevrátí hráče do navštívené scény.
if(s.step===2||s.step===3){if(ch[1]==='time'&&!s.flags.visitedTime){next=2}else if(ch[1]==='people'&&!s.flags.visitedPeople){next=3}else next=4}
if(s.step===4){next=ch[1]==='water'?5:6}
if(s.step===5){next=ch[1]==='victims'&&!s.flags.visitedVictims?6:7}
if(s.step===6){next=ch[1]==='water'&&!s.flags.visitedWater?5:7}
if(s.step===7){if(Object.keys(s.inferences).length<3){alert('Nejdřív vyhodnoť všechny tři důkazní otázky.');return}next=8;}
if(s.step===8)next=9;
if(next===2)s.flags.visitedTime=true;
if(next===3)s.flags.visitedPeople=true;
if(next===5)s.flags.visitedWater=true;
if(next===6)s.flags.visitedVictims=true;
if(next===9)s.solved=true;
s.step=next;save();draw();window.scrollTo({top:0,behavior:'smooth'})}
function restart(){if(confirm('Začít vyšetřování znovu?')){localStorage.removeItem(KEY);location.reload()}}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[x]))}
function draw(){let sc=scenes[s.step];document.getElementById('bar').style.width=(s.step/9*100)+'%';document.getElementById('status').textContent='ORLICKÉ VRAŽDY · '+(sc.end?'SPIS UZAVŘEN':'VYŠETŘOVÁNÍ PROBÍHÁ');let content='<div class="eyebrow">'+sc.where+'</div><h1>'+sc.title+'</h1><div class="scene"><p>'+sc.story+'</p>'+(sc.voice?'<div class="speech">'+sc.voice+'</div>':'')+'</div>';if(sc.evidence)content+='<div class="evidence"><div style="font-size:11px;letter-spacing:.14em">PODKLAD</div><h2>'+sc.evidence[0]+'</h2><p>'+sc.evidence[1]+'</p><p class="muted">'+sc.evidence[2]+'</p></div>';if(sc.assemble){document.getElementById('game').innerHTML=reportUI();return}if(s.step===7){document.getElementById('game').innerHTML=puzzle();return}if(sc.end)content+='<div class="note"><strong>Tvoje závěrečná zpráva</strong>'+REPORT.map((x,i)=>'<p>• '+esc(x.options[s.reportParts[i]]||'Nezpracováno')+'</p>').join('')+'</div><p>Podložené závěry v důkazním rozboru: '+INFERENCES.filter((x,i)=>s.inferences[i]===x.correct).length+'/3. V závěrečné zprávě: '+REPORT.filter((x,i)=>s.reportParts[i]===x.correct).length+'/3.</p><p><a href="https://www.irozhlas.cz/veda-technologie_historie/pred-20-lety-nasli-potapeci-hrbitov-na-dne-prehrady-nastal-zlom-v-kauze-orlickych-vrahu_201507141624_lkrejcarova" target="_blank" rel="noopener">Historický zdroj: Český rozhlas ↗</a></p><button class="choice primary" onclick="restart()">Zahrát případ znovu</button>';else content+='<div class="eyebrow" style="margin-top:25px">CO UDĚLÁŠ?</div>'+sc.choices.map((ch,i)=>'<button class="choice '+(sc.choices.length===1?'primary':'')+'" onclick="choose('+i+')">'+ch[0]+'</button>').join('');content+='<details><summary>O historické rekonstrukci a ovládání</summary><p>Hraješ za fiktivního kriminalistu. Scény, dialogy a pořadí zpřístupnění dokumentů jsou herní dramatizace, nikoli autentické přepisy. Skutečné osoby, doložené události a soudní výsledek jsou oddělené od fikce.</p><p>Hra postup ukládá automaticky. Není nutné přecházet do žádné záložky ani se vracet.</p><button class="choice" onclick="restart()">Začít od začátku</button><a href="./index.html">Zpět do knihovny</a></details>';document.getElementById('game').innerHTML=content}draw();
</script></body></html>
