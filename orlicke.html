<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASE ZERO · Orlické vraždy</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1419;color:#f1f0e9;font:16px/1.65 system-ui,-apple-system,sans-serif}header{height:62px;padding:16px 20px;border-bottom:1px solid #34434b;background:#101b22;display:flex;justify-content:space-between;align-items:center}header b{color:#e8c184;letter-spacing:.16em}main{max-width:630px;margin:0 auto;padding:26px 20px 100px}.eyebrow{color:#e8c184;font-size:12px;letter-spacing:.14em;font-weight:700}h1{font:34px/1.18 Georgia,serif;margin:12px 0 18px}h2{font:24px Georgia,serif}.scene{min-height:230px;background:linear-gradient(155deg,#253843,#101a20);border:1px solid #3a505a;border-radius:15px;padding:24px 21px;margin:18px 0}.scene p{margin:0 0 15px}.speech{border-left:3px solid #e8c184;padding:12px 16px;background:#293942;margin:18px 0;font-style:italic}.choice{display:block;width:100%;text-align:left;background:#1b2b35;color:#f0f2ef;border:1px solid #536670;border-radius:10px;padding:16px;margin:10px 0;font:inherit;min-height:54px}.choice:active{background:#42545a}.primary{background:#e8c184;color:#1c2428;border-color:#e8c184;font-weight:700}.muted{color:#b1c0c5;font-size:14px}.evidence{background:#d8d1bb;color:#222b2d;padding:22px;margin:20px 0;border-radius:3px;box-shadow:0 7px 24px #0007;transform:rotate(-.5deg)}.evidence h2{margin-top:6px}.line{border-top:1px solid #3c4d55;padding-top:16px;margin-top:16px}.progress{height:3px;background:#2b3a40;margin:0}.progress div{height:100%;background:#e8c184;transition:width .3s}.bottom{position:fixed;bottom:0;left:0;right:0;background:#101b22;border-top:1px solid #34434b;padding:12px 20px;text-align:center;color:#a8b9c1;font-size:12px}.pill{display:inline-block;border:1px solid #5a6d76;border-radius:30px;padding:4px 11px;font-size:12px;margin:4px 4px 4px 0}.note{padding:14px;background:#2a2b26;border-left:3px solid #e8c184;font-size:14px}a{color:#e8c184}textarea{width:100%;min-height:115px;background:#101b22;border:1px solid #71828a;border-radius:8px;color:white;font:inherit;padding:12px}details{margin-top:40px;color:#b3c0c5;font-size:13px}summary{cursor:pointer}
</style></head><body><header><b>CASE ZERO</b><span style="font-size:12px;color:#a7b6bc">SPIS 007</span></header><div class="progress"><div id="bar"></div></div><main id="game"></main><div class="bottom" id="status"></div><script>
const KEY='casezero_orlik_firstperson_v1';
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s)s={step:0,flags:{},path:[],note:'',solved:false};s.flags ||= {};s.path ||= [];
const scenes=[
{where:'PRAHA · KRIMINÁLNÍ POLICIE · LÉTO 1995',title:'Někdo klepe na dveře',story:'Sedíš ve své kanceláři. Za oknem je horké odpoledne. Kolega vstoupí a položí před tebe složku označenou „Pohřešovaní“.',voice:'„Máme několik zmizení. Něco mi na těch případech nesedí. Potřebuju, aby ses na ně podíval.“',choices:[['Zeptám se, co ho znepokojuje','question'],['Otevřu složku a začnu číst','read']]},
{where:'KANCELÁŘ · PRVNÍ INFORMACE',title:'Nejasná zmizení',story:'Kolega zůstává stát u stolu. Přehled událostí zatím neukazuje jasnou souvislost. Víš jen, že někteří pohřešovaní měli obchodní a osobní vazby.',voice:'„Nechci tvrdit, že jde o jednu věc. Ale některé okolnosti stojí za prověření.“',choices:[['Nejdřív sestavím časovou osu','time'],['Prověřím kontakty pohřešovaných','people']]},
{where:'KANCELÁŘ · PRACOVNÍ ZÁZNAM',title:'Časová osa',story:'Záznamy ukazují, že později prokázané vraždy se odehrály v letech 1991 až 1993. V tuto chvíli ale nevíš, které zmizení má trestní pozadí.',evidence:['PRACOVNÍ CHRONOLOGIE','1991–1993: období později prokázané série pěti vražd.','Historický údaj; podoba dokumentu je herní rekonstrukcí.'],choices:[['Zaměřím se na společné kontakty','people'],['Požádám kolegu o další zjištění','follow']]},
{where:'KANCELÁŘ · PROVĚŘOVÁNÍ',title:'Okruh osob',story:'Na stole leží jména, která se v historickém vyšetřování ukázala jako důležitá. Je však zásadní nepřisuzovat všem stejnou roli.',evidence:['PROVĚŘOVANÉ OSOBY','Karel Kopáč, Ludvík Černý, Vladimír Kuna, Petr Chodounský a Irena Meierová.','Jména vycházejí z historické kauzy; seznam není autentický dobový dokument.'],choices:[['Prověřím, co se stalo s pohřešovanými','follow'],['Porovnám jejich vazby s časovou osou','time']]},
{where:'KANCELÁŘ · NOVÁ INFORMACE',title:'Stopa vede k přehradě',story:'Do kanceláře přichází zpráva o pátrání v Orlické přehradě. V roce 1995 se zde skutečně podařilo nalézt ostatky obětí. Pro vyšetřování šlo o zásadní průlom.',voice:'„Teď už potřebujeme každé tvrzení podložit. Nestačí jen podezření.“',choices:[['Chci vědět, co nálezy skutečně prokazují','water'],['Nejdřív porovnám seznam obětí','victims']]},
{where:'PÁTRACÍ ZPRÁVA · ORLICKÁ PŘEHRADA',title:'Hmotný důkaz',story:'Nález ostatků v červenci 1995 umožnil kriminalistům posunout vyšetřování od nejasných zmizení k dokazování násilných trestných činů.',evidence:['VÝSLEDEK PÁTRÁNÍ','Orlická přehrada, červenec 1995: nalezené ostatky se staly klíčovou součástí vyšetřování.','Shrnutí doložené události, nikoli kopie policejního protokolu.'],choices:[['Porovnám nález se známými oběťmi','victims'],['Připravím předběžný závěr','deduction']]},
{where:'KANCELÁŘ · SOUHRN OBĚTÍ',title:'Pět životů',story:'Pozdější soudní dokazování potvrdilo pět vražd. Případy měly rozdílné okolnosti, přesto mezi nimi existovaly vazby.',evidence:['HISTORICKY PROKÁZANÉ OBĚTI','Aleš Katovský, Leorent Lipoveci, Anna Medková, Vlastimil Hodr a Jaroslav Meier.','Jde o historický souhrn; v herní scéně jsou informace záměrně zpřístupněny postupně.'],choices:[['Vysvětlím si vztah mezi oběťmi a nálezy','deduction'],['Znovu prověřím hmotný důkaz','water']]},
{where:'KANCELÁŘ · TVŮJ ÚSUDEK',title:'Co už lze doložit?',story:'Máš několik zjištění. Rozhodni, jaký závěr je podložený. Nejde o hádání jména pachatele, ale o rozlišení důkazu od domněnky.',choices:[['Nálezy a vazby ukazují na více propojených vražd','correct'],['Všechna zmizení byla jistě nehody','wrong'],['Všichni prověřovaní měli totožnou roli','wrong']]},
{where:'KANCELÁŘ · POSLEDNÍ ZÁZNAM',title:'Tvoje vyšetřovací zpráva',story:'Před uzavřením spisu shrň vlastními slovy, jaké informace byly rozhodující. Historický výsledek se zobrazí až po tvém závěru.',write:true,choices:[['Odevzdat závěrečnou zprávu','ending']]},
{where:'HISTORICKÉ ROZUZLENÍ',title:'Co se skutečně stalo',story:'Série pěti vražd z let 1991 až 1993 byla objasněna. Nálezy v Orlické přehradě v roce 1995 významně přispěly k usvědčení pachatelů. V roce 1997 padly odsuzující rozsudky; Ludvík Černý dostal doživotí, další odsouzení rozdílné tresty.',end:true}
];
const flow={question:1,read:1,time:2,people:3,follow:4,water:5,victims:6,deduction:7,correct:8,wrong:8,ending:9};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function choose(i){let sc=scenes[s.step],ch=sc.choices[i];if(sc.write){s.note=document.getElementById('report').value.trim();if(!s.note){alert('Nejdřív napiš krátký závěr vyšetřování.');return}}s.path.push(ch[1]);s.flags[ch[1]]=true;let next=flow[ch[1]];if((next===2&&s.flags.time)||(next===3&&s.flags.people)){next=4}if(next===5&&s.flags.water)next=6;if(next===6&&s.flags.victims)next=7;if(next===7&&(!s.flags.water||!s.flags.victims)){next=s.flags.water?6:5}if(next===9)s.solved=true;s.step=next;save();draw();window.scrollTo({top:0,behavior:'smooth'})}
function restart(){if(confirm('Začít vyšetřování znovu?')){localStorage.removeItem(KEY);location.reload()}}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[x]))}
function draw(){let sc=scenes[s.step];document.getElementById('bar').style.width=(s.step/9*100)+'%';document.getElementById('status').textContent='ORLICKÉ VRAŽDY · '+(sc.end?'SPIS UZAVŘEN':'VYŠETŘOVÁNÍ PROBÍHÁ');let content='<div class="eyebrow">'+sc.where+'</div><h1>'+sc.title+'</h1><div class="scene"><p>'+sc.story+'</p>'+(sc.voice?'<div class="speech">'+sc.voice+'</div>':'')+'</div>';if(sc.evidence)content+='<div class="evidence"><div style="font-size:11px;letter-spacing:.14em">PODKLAD</div><h2>'+sc.evidence[0]+'</h2><p>'+sc.evidence[1]+'</p><p class="muted">'+sc.evidence[2]+'</p></div>';if(sc.write)content+='<label for="report">Tvoje poznámky kriminalisty</label><textarea id="report" placeholder="Které stopy byly zásadní? Jak spolu události souvisí?">'+esc(s.note||'')+'</textarea>';if(sc.end)content+='<div class="note"><strong>Tvoje závěrečná zpráva</strong><p>'+esc(s.note||'Bez záznamu')+'</p></div><p><a href="https://www.irozhlas.cz/veda-technologie_historie/pred-20-lety-nasli-potapeci-hrbitov-na-dne-prehrady-nastal-zlom-v-kauze-orlickych-vrahu_201507141624_lkrejcarova" target="_blank" rel="noopener">Historický zdroj: Český rozhlas ↗</a></p><button class="choice primary" onclick="restart()">Zahrát případ znovu</button>';else content+='<div class="eyebrow" style="margin-top:25px">CO UDĚLÁŠ?</div>'+sc.choices.map((ch,i)=>'<button class="choice '+(sc.choices.length===1?'primary':'')+'" onclick="choose('+i+')">'+ch[0]+'</button>').join('');content+='<details><summary>O historické rekonstrukci a ovládání</summary><p>Hraješ za fiktivního kriminalistu. Scény, dialogy a pořadí zpřístupnění dokumentů jsou herní dramatizace, nikoli autentické přepisy. Skutečné osoby, doložené události a soudní výsledek jsou oddělené od fikce.</p><p>Hra postup ukládá automaticky. Není nutné přecházet do žádné záložky ani se vracet.</p><button class="choice" onclick="restart()">Začít od začátku</button><a href="./index.html">Zpět do knihovny</a></details>';document.getElementById('game').innerHTML=content}draw();
</script></body></html>
