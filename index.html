v době blízké smrti.'],['money','invoice','k3','Finanční konflikt','Královo vysvětlení neodstraňuje pochybnosti o platbě.'],['escape','door','m1','Servisní cesta','Pachatel mohl opustit chatu servisním vstupem.'],['car','road','k5','Auto a nevysvětlený řidič','Král nedokáže doložit, kdo jeho vůz řídil.'],['dnaLink','dna','k6','Krev versus výpověď','Krev oběti v Králově voze odporuje jeho popření kontaktu.'],['others','evaAlibi','marekAlibi','Alternativní podezřelí','Obě alibi jsou podpořena nezávislými podklady.'],['motive','letter','ledger','Bezprostřední motiv','Oběť plánovala oznámit podezřelý převod.']];const btn=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(t){S.tab=t;save();render();window.scrollTo(0,0)}function modal(html){document.querySelector('.modal')?.remove();let e=document.createElement('div');e.className='modal';e.innerHTML='<div class="modalbox">'+html+'<button class="btn full" onclick="closeModal()">Zavřít</button></div>';e.addEventListener('click',x=>{if(x.target===e)e.remove()});document.body.appendChild(e)}function closeModal(){document.querySelector('.modal')?.remove()}function collect(id){if(!has(id)){S.found.push(id);save()}closeModal();render()}function inspect(id){let x=evidence(id);modal(`<div class="eyebrow">OHLEDÁNÍ · DETAIL NÁLEZU</div><div class="doc"><div class="stamp">FOTODOKUMENTACE / SPIS CZ-001</div><h3>${x.name}</h3><p>${x.desc}</p></div>${has(id)?'<p class="muted">Stopa je již zajištěna.</p>':btn('Zajistit jako důkaz',`collect('${id}')`,'gold full')}`)}function documentView(id){let x=evidence(id);modal(`<div class="eyebrow">DŮKAZNÍ SPIS · ${id.toUpperCase()}</div><div class="doc"><div class="stamp">POLICIE ČR · FIKTIVNÍ DOKUMENT</div><h3>${x.name}</h3><p>${x.desc}</p><hr><p class="small">Důkaz posuzuj v souvislosti s ostatními nálezy. Samostatně nemusí prokazovat vinu.</p></div>`)}function ask(id){if(!S.interviews.includes(id))S.interviews.push(id);save();render()}function action(id,kind){let pool=kind==='lab'?LAB:OPS;let row=pool.find(x=>x[0]===id);if(!row||!row[2].every(has)||has(id))return;S[kind==='lab'?'tests':'ops'].push(id);if(!S.found.includes(id))S.found.push(id);save();render()}function connect(id){let x=LINKS.find(y=>y[0]===id);if(!x||!has(x[1])||!has(x[2])||has(id))return;S.links.push(id);save();render()}function subnav(items,current){return '<div class="tabs">'+items.map(([id,name])=>`<button class="${current===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('')+'</div>'}function scene(){let r=ROOMS.find(x=>x.id===S.room)||ROOMS[0];return `<div class="eyebrow">OHLEDÁNÍ · 22:41</div><h1>Chata č. 17</h1><p class="muted">Prohlížej prostředí, otevři nález a rozhodni, co zajistit. Stopy nejsou automaticky důkazy.</p><div class="tabs">${ROOMS.map(x=>`<button class="${r.id===x.id?'active':''}" onclick="setRoom('${x.id}')">${x.icon} ${x.name}</button>`).join('')}</div><div class="scene"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-label="Ilustrace ${r.name}">${ART[r.id]}</svg>${r.spots.map(([id,x,y])=>`<button class="spot ${has(id)?'done':''}" style="left:${x}%;top:${y}%" aria-label="Prohlédnout nález" onclick="inspect('${id}')">${has(id)?'✓':'+'}</button>`).join('')}<div class="scenefoot">${r.name} · ${r.spots.filter(([id])=>has(id)).length}/${r.spots.length} prozkoumaných stop</div></div><div class="card"><h3>${r.name}</h3><p>${r.desc}</p><p class="small muted">Klepni na značky ve scéně. Zelené jsou již zajištěné.</p></div>`}function setRoom(id){S.room=id;save();render()}function interviews(){return `<div class="eyebrow">KRIMINÁLNÍ ODDĚLENÍ</div><h1>Výslechy osob</h1><p class="muted">Otázky se odemykají podle zajištěných důkazů. Výpovědi mohou obsahovat lži i nevinné nepřesnosti.</p>${PEOPLE.map(p=>`<div class="card"><div class="person"><div class="avatar">${p.avatar}</div><div><h3>${p.name}</h3><div class="small muted">${p.role}</div></div></div><p>${p.info}</p>${Q[p.id].map(([q,a,id,req])=>`<details ${req&&!has(req)?'style="opacity:.45"':''}><summary class="question ${has(id)?'done':''}">${has(id)?'✓ ':''}${req&&!has(req)?'🔒 ':''}${q}</summary>${req&&!has(req)?'<p class="small muted">Potřebuješ další důkaz.</p>':`<div class="dialogue"><div class="eyebrow">VÝPOVĚĎ · ${p.name}</div><p>„${a}“</p>${btn(has(id)?'✓ Zapsáno':'Zapsat do protokolu',`ask('${id}')`,'full')}</div>`}</details>`).join('')}</div>`).join('')}`};function operations(){return `<div class="eyebrow">OPERATIVNÍ ÚKONY</div><h1>Co prověříš dál?</h1><p class="muted">Volíš další kroky podle toho, co už víš. Nepřesvědčivé stopy mohou vést do slepé uličky.</p>${OPS.map(([id,name,req])=>`<div class="card"><h3>${name}</h3><p class="small muted">${req.every(has)?'K dispozici potřebné podklady.':'Nejdříve zajisti související informace.'}</p><button class="btn full ${req.every(has)&&!has(id)?'gold':''}" ${!req.every(has)||has(id)?'disabled':''} onclick="action('${id}','ops')">${has(id)?'✓ Provedeno':'Provést úkon'}</button></div>`).join('')}`};function dossier(){return `<div class="eyebrow">VYŠETŘOVACÍ SPIS</div><h1>Zajištěné důkazy</h1><p class="muted">Ve spisu jsou pouze nalezené a zajištěné stopy. Otevři dokument pro detail.</p>${S.found.length?[...new Set(S.found)].map(id=>{let x=evidence(id);return `<div class="doc"><div class="stamp">CZ-001 / ${id.toUpperCase()}</div><h3>${x.name}</h3><p>${x.desc}</p>${btn('Otevřít dokument',`documentView('${id}')`,'full')}</div>`}).join(''):'<div class="card">Zatím žádný důkaz. Začni ohledáním chaty.</div>'}`};function lab(){return `<div class="eyebrow">KRIMINALISTICKÁ LABORATOŘ</div><h1>Expertizy</h1><p class="muted">Vyber analýzy podle nálezů. Ne každá expertiza přinese jednoznačnou odpověď.</p>${LAB.map(([id,name,req])=>`<div class="card"><h3>${name}</h3><p class="small muted">${req.every(has)?'Podklady zajištěny.':'Chybí potřebný vzorek.'}</p><button class="btn full" ${!req.every(has)||has(id)?'disabled':''} onclick="action('${id}','lab')">${has(id)?'✓ Výsledek ve spisu':'Vyžádat expertizu'}</button></div>`).join('')}`};function analysis(){return `<div class="eyebrow">ANALYTICKÁ TABULE</div><h1>Propoj souvislosti</h1><p class="muted">Důkazy nejsou automaticky propojené. Ověřuj rozpory a sestav vlastní hypotézu.</p>${LINKS.map(([id,a,b,title,result])=>`<div class="card"><h3>${title}</h3><p class="small muted">${has(id)?result:has(a)&&has(b)?'Máš oba podklady. Můžeš vyhodnotit jejich souvislost.':'Pro tuto hypotézu zatím chybí informace.'}</p><button class="btn full" ${!has(a)||!has(b)||has(id)?'disabled':''} onclick="connect('${id}')">${has(id)?'✓ Propojeno':'Vyhodnotit souvislost'}</button></div>`).join('')}<div class="card"><h3>Vyšetřovací poznámky</h3><textarea id="notes" placeholder="Kdo měl motiv? Kdo lže? Co ještě ověřit?">${esc(S.notes)}</textarea>${btn('Uložit poznámky','saveNotes()','full')}</div>${btn('Připravit závěrečnou zprávu',"go('verdict')",'gold full')}`};function saveNotes(){S.notes=document.getElementById('notes').value;save();render()}function verdict(){if(S.verdict)return `<div class="eyebrow">UZAVŘENÝ SPIS</div><h1>${S.verdict.correct?'Správný závěr':'Nedostatečné podklady'}</h1><div class="card"><h2>Hodnocení ${S.verdict.score}/100</h2><p>${S.verdict.correct?'Podařilo se ti propojit objektivní důkazy, výpovědi a motiv.':'Obvinění nebylo dostatečně podloženo.'}</p></div><div class="card"><h2>Rekonstrukce případu</h2><div class="timeline"><p><b>21:48</b> Tmavé auto přijíždí k chatám.</p><p><b>22:14</b> Martin telefonuje Pavlu Královi.</p><p><b>22:20–22:30</b> Spor o převod přerůstá v násilí.</p><p><b>22:39</b> Královo vozidlo zachycuje kamera u výjezdu.</p></div><p><b>Scénář:</b> Pachatelem je Pavel Král. Klíčové jsou krev oběti v jeho autě, nevysvětlené použití vozu a motiv související s oznámením finančního převodu. Přímý záznam útoku neexistuje.</p></div>${btn('Začít znovu','reset()','full')}`;return `<div class="eyebrow">ZÁVĚREČNÁ ZPRÁVA</div><h1>Uzavření případu</h1><div class="notice">Pozor: Odevzdáním zprávy se odhalí řešení. Nejprve prověř alternativní podezřelé.</div><div class="card"><h3>Koho obviňuješ?</h3><select id="who"><option value="">Vyber osobu</option>${PEOPLE.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><h3 style="margin-top:17px">Motiv</h3><select id="why"><option value="">Vyber motiv</option><option value="money">Zakrytí finančního podvodu</option><option value="divorce">Rozvodový spor</option><option value="revenge">Osobní pomsta</option><option value="theft">Loupež</option></select><h3 style="margin-top:17px">Podpůrné důkazy (2–4)</h3>${S.found.map(id=>`<label class="choice"><input type="checkbox" class="proof" value="${id}">${evidence(id).name}</label>`).join('')}${btn('Odevzdat zprávu','submitVerdict()','gold full')}</div>`}function submitVerdict(){let who=document.getElementById('who').value,why=document.getElementById('why').value,proof=[...document.querySelectorAll('.proof:checked')].map(x=>x.value);if(!who||!why||proof.length<2||proof.length>4){alert('Vyber osobu, motiv a 2–4 důkazy.');return}if(!confirm('Opravdu uzavřít případ a odhalit řešení?'))return;let correct=who==='kral'&&why==='money'&&proof.includes('dna')&&proof.includes('road')&&(proof.includes('ledger')||proof.includes('letter'))&&S.links.includes('dnaLink');let score=(who==='kral'?20:0)+(why==='money'?15:0)+(proof.includes('dna')?25:0)+(proof.includes('road')?15:0)+(proof.includes('ledger')||proof.includes('letter')?10:0)+(S.links.includes('dnaLink')?15:0);S.verdict={correct,score};save();render()}function reset(){if(confirm('Smazat postup a začít znovu?')){S=initial();save();go('home')}}function render(){let html='';if(S.tab==='home')html=`<div class="hero"><div class="eyebrow">PŘÍPAD 001 · JIŽNÍ ČECHY</div><h1>Ticho u jezera</h1><p>Na Třeboňsku byl v rekreační chatě nalezen mrtvý podnikatel Martin Novotný. Dveře byly zamčené. Nikdo zatím neví, co se v noci stalo.</p></div><div class="card"><div class="eyebrow">OPERAČNÍ STŘEDISKO</div><h2>Vyšetřování začíná</h2><p>Prohlédni místo činu, vyslechni osoby, ověř alibi a sestav důkazní řetězec. Hra tě nepovede ke každému důkazu automaticky.</p>${btn('Pokračovat ve vyšetřování',"go('scene')",'gold full')}</div><p class="small muted">Fiktivní případ a postavy. Postup se ukládá lokálně v prohlížeči. Nová verze hry.</p>`;if(S.tab==='map')html=`<div class="eyebrow">REGION 01 · JIŽNÍ ČECHY</div><h1>Mapa vyšetřování</h1><div class="map"><button class="pin" style="left:69%;top:72%" onclick="go('scene')">⌖<span>Chata č. 17</span></button><button class="pin" style="left:58%;top:48%" onclick="go('people')">⌖<span>Třeboň</span></button><button class="pin" style="left:84%;top:35%" onclick="go('people')">⌖<span>J. Hradec</span></button><button class="pin" style="left:28%;top:65%" onclick="go('lab')">⌖<span>Č. Budějovice</span></button></div><div class="card"><h3>Aktivní vyšetřování</h3><p>Fiktivní chata u rybníka na Třeboňsku. Města na mapě jsou skutečná, umístění je orientační.</p>${btn('Přejít na místo činu',"go('scene')",'gold full')}</div>`;if(['scene','people','operations'].includes(S.tab)){html=subnav([['scene','Místo činu'],['people','Výslechy'],['operations','Prověřování']],S.tab)+(S.tab==='scene'?scene():S.tab==='people'?interviews():operations())}if(['evidence','lab'].includes(S.tab)){html=subnav([['evidence','Důkazy'],['lab','Laboratoř']],S.tab)+(S.tab==='evidence'?dossier():lab())}if(S.tab==='board')html=analysis();if(S.tab==='verdict')html=verdict();document.getElementById('app').innerHTML=html;document.getElementById('progress').textContent=[...new Set(S.found)].length+' / '+E.length+' STOP';document.getElementById('nav').innerHTML=[['map','◉','Mapa'],['scene','⌕','Vyšetřování'],['evidence','▤','Spis'],['board','◇','Analýza']].map(([id,ic,label])=>`<button class="${(id==='scene'&&['scene','people','operations'].includes(S.tab))||(id==='evidence'&&['evidence','lab','verdict'].includes(S.tab))||(id==='board'&&S.tab==='board')||(id==='map'&&['map','home'].includes(S.tab))?'active':''}" onclick="go('${id}')"><b>${ic}</b>${label}</button>`).join('')}render();
</script></body></html>
