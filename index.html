if(S.tab==='intro'){html=`<div class="eyebrow">REGION 01 · JIHOČESKÝ KRAJ · FIKTIVNÍ PŘÍPAD</div><h1>Ticho u jezera</h1><div class="scene"><div style="position:absolute;z-index:2;left:15px;top:18px;font-weight:800;letter-spacing:.2em;color:#e9d8ae">22:41 · HLÁŠENÍ</div></div><div class="card"><h2>Operační středisko</h2><p>Na Třeboňsku, u fiktivní rekreační chaty, byl nalezen mrtvý <b>Martin Novotný (46)</b>, podnikatel. Hlídka uvádí zamčené dveře a známky zápasu. Poslední známý telefonát oběti proběhl ve 22:14.</p><p>Čtyři osoby mohou mít důležité informace. Zatím není jasné, zda jde o vraždu ani kdo se v chatě pohyboval.</p><div class="notice">Tvůj úkol: ohledat místo, zajistit důkazy, vyslechnout svědky, provést analýzy a odevzdat odůvodněný závěr.</div>${button('OTEVŘÍT MAPU VYŠETŘOVÁNÍ','tab(\'map\')','primary wide')}</div><p class="foot">Příběh, postavy a důkazy jsou smyšlené. Prototyp funguje offline po načtení a ukládá postup v tomto prohlížeči.</p>`}
if(S.tab==='scene'){html=`<div class="eyebrow">OHLEDÁNÍ MÍSTA ČINU</div><h1>Chata č. 17</h1><p>Prohlédni jednotlivé části objektu. U každého nálezu rozhodni, zda jej zajistíš.</p><div class="rooms">${ROOMS.map(r=>`<button class="${S.room===r.id?'selected':''}" onclick="chooseRoom('${r.id}')">${r.icon} ${r.name}</button>`).join('')}</div><div class="card" style="min-height:230px;background:${ROOMS.find(r=>r.id===S.room).bg}"><h2>${ROOMS.find(r=>r.id===S.room).name}</h2><p>${ROOMS.find(r=>r.id===S.room).desc}</p><div class="grid">${ROOMS.find(r=>r.id===S.room).items.map(id=>button((has(id)?'✓ ':'⌕ ')+E.find(e=>e.id===id).name,`inspect('${id}')`)).join('')}</div></div><div class="card"><h3>Protokol ohledání</h3><p>Každý zajištěný nález se uloží do spisu. Další informace získáš z výslechů a expertiz.</p>${button('Otevřít důkazní spis','tab(\'evidence\')','primary wide')}</div>`}
if(S.tab==='evidence'){html=`<div class="eyebrow">DŮKAZNÍ MATERIÁL</div><h1>Spis a expertizy</h1><p class="muted">Laboratoř má ${S.labCredits} dostupných analýz. Další kapacitu získáš po třech správně propojených souvislostech. Další operativní úkony najdeš v záložce Úkony.</p>${E.filter(x=>has(x.id)).map(x=>`<div class="report"><h3>${x.icon} ${x.name}</h3><p>${x.desc}</p>${button("Zobrazit protokol",`evidenceDetail(\x27${x.id}\x27)`,"wide")}</div>`).join('')||'<div class="card">Nejdřív prozkoumej místo činu.</div>'}<div class="card"><h2>Žádosti do laboratoře</h2>${tests.map(t=>`<button class="choice" ${S.tests.includes(t.id)||!t.requires.every(has)||S.labCredits<1?'disabled':''} onclick="test('${t.id}')">${S.tests.includes(t.id)?'✓ ':''}${t.label} · 1 kapacita</button>`).join('')}</div>`}
if(S.tab==='people'){html=`<div class="eyebrow">OPERATIVNÍ VÝSLECHY</div><h1>Osoby v případu</h1>${people.map(p=>`<div class="card"><h2>${p.name}</h2><div class="muted small">${p.role}</div><p>${p.info}</p>${(dialogs[p.id]||[]).map(([q,answer,id,req])=>`<details ${req&&!has(req)?'style="opacity:.45"':''}><summary>${req&&!has(req)?'🔒 ':''}${q}</summary>${req&&!has(req)?'<p class="muted">Nejdřív zajisti příslušný důkaz.</p>':`<div class="quote">„${answer}“</div><button class="btn wide" onclick="interview('${id}')">${has(id)?'✓ Zapsáno do protokolu':'Zapsat odpověď do protokolu'}</button>`}</details>`).join('')}</div>`).join('')}`}
if(S.tab==='operations'){html=`<div class="eyebrow">OPERATIVNÍ PROVĚŘOVÁNÍ</div><h1>Další vyšetřovací kroky</h1><p class="muted">Nové stopy se neobjeví automaticky. Musíš vědět, o co požádat a proč. Některé úkony se odemknou až po zajištění podkladů.</p>${OPERATIONS.map(o=>`<div class="card"><h3>${o.title}</h3><p class="small muted">${o.desc}</p>${S.operations.includes(o.id)?'<span class="tag new">✓ Provedeno</span>':button(o.req.every(has)?'Provést úkon':'Nejdřív zajisti podklady',`operation('${o.id}')`,o.req.every(has)?'primary wide':'wide').replace('<button','<button '+(!o.req.every(has)?'disabled':'') )}</div>`).join('')}<div class="notice">Tip: Prověř i osoby, proti kterým svědčí jen nepřímé okolnosti. Skutečný důkaz musí obstát i proti alternativním vysvětlením.</div>`}
if(S.tab==='board'){html=`<div class="eyebrow">ANALYTICKÁ TABULE</div><h1>Souvislosti</h1><p class="muted">Spojuj konkrétní důkazy a výpovědi. Ne každý rozpor automaticky znamená vinu.</p>${links.map(l=>`<div class="card"><h3>${l.name}</h3><p class="small muted">${has(l.a)&&has(l.b)?l.result:'Potřebuješ obě související stopy nebo výpovědi.'}</p>${button(S.links.includes(l.id)?'✓ Souvislost zaznamenána':'Propojit stopy',`link('${l.id}')`,has(l.a)&&has(l.b)&&!S.links.includes(l.id)?'primary wide':'wide') .replace('<button','<button '+(!(has(l.a)&&has(l.b))||S.links.includes(l.id)?'disabled':'') )}</div>`).join('')}<div class="card"><h3>Vyšetřovací poznámky</h3><textarea id="notes" placeholder="Vlastní hypotézy, rozpory, další kroky…">${esc(S.notes)}</textarea>${button('Uložit poznámky','saveNotes()','wide')}</div><div class="card"><h2>Uzavření spisu</h2><p>Než podáš obvinění, ověř si alternativní vysvětlení a vyber podpůrné důkazy.</p>${button('Připravit závěrečnou zprávu','tab(\'verdict\')','primary wide')}</div>`}
if(S.tab==='verdict'){html=`<div class="eyebrow">ZÁVĚREČNÁ ZPRÁVA</div><h1>Tvůj závěr</h1>${S.verdict?verdictHtml():`<div class="notice">Obvinění můžeš podat kdykoliv, ale bez dostatečných důkazů riskuješ neúspěch. V této verzi je řešení pevně dané.</div><div class="card"><h3>1. Koho obviňuješ?</h3><select id="accused"><option value="">Vyber osobu</option>${people.map(p=>`<option value="${p.id}" ${S.accused===p.id?'selected':''}>${p.name}</option>`).join('')}</select><h3 style="margin-top:16px">2. Jaký byl motiv?</h3><select id="motive"><option value="">Vyber motiv</option><option value="money">Zakrytí finančního podvodu</option><option value="divorce">Spor při rozvodu</option><option value="revenge">Osobní pomsta</option><option value="theft">Náhodná loupež</option></select><h3 style="margin-top:16px">3. Které důkazy předkládáš?</h3><p class="muted small">Vyber nejvýše čtyři. Důkazy posuzujeme společně, nikoliv každý izolovaně.</p>${E.filter(x=>has(x.id)).map(x=>`<label class="choice"><input type="checkbox" class="proof" value="${x.id}"> ${x.name}</label>`).join('')}${button('ODEVZDAT ZÁVĚREČNOU ZPRÁVU','submitVerdict()','primary wide')}</div>`}`}
a.innerHTML=html;document.getElementById('nav').innerHTML=[['intro','⌂','Úvod'],['map','◉','Mapa'],['scene','⌕','Místo'],['evidence','▤','Důkazy'],['people','♟','Osoby'],['operations','⚑','Úkony'],['board','◇','Tabule'],['verdict','⚖','Závěr']].map(([id,icon,name])=>`<button class="${S.tab===id?'on':''}" onclick="tab('${id}')"><i>${icon}</i>${name}</button>`).join('')}

const ROOMS=[{id:'exterior',icon:'🌲',name:'Příjezd a terasa',bg:'linear-gradient(145deg,#253e4c,#31483d)',desc:'Mlha nad rybníkem. Mokrá zem u terasy, servisní dveře a kamera na přístavišti.',items:['mud','camera','lock']},{id:'living',icon:'🛋',name:'Obývací pokoj',bg:'linear-gradient(145deg,#4a514e,#292f37)',desc:'Dva hrnky, telefon pod pohovkou a poškozené hodinky.',items:['cup','phone','watch']},{id:'office',icon:'📁',name:'Pracovna',bg:'linear-gradient(145deg,#343d43,#5c4d3f)',desc:'Účetní dokumenty mohou vysvětlit důvod poslední návštěvy.',items:['invoice']},{id:'service',icon:'🚪',name:'Servisní vstup',bg:'linear-gradient(145deg,#303f3a,#454b41)',desc:'Mechanická západka mohla umožnit odchod bez použití hlavních dveří.',items:['lock']}];function chooseRoom(id){S.room=id;save();render()}function evidenceDetail(id){const x=E.find(e=>e.id===id);if(!x)return;alert('POLICEJNÍ SPIS / '+x.name+'\n\n'+x.desc)};const OPERATIONS=[{id:'draft',title:'Zajistit notebook a koncept dopisu',desc:'Po nalezení účetních dokladů můžeš prověřit, co oběť plánovala oznámit.',req:['invoice'],gives:'draft'},{id:'gate',title:'Vyžádat čitelný záznam z výjezdu',desc:'Původní kamera neukazuje SPZ. Prověř další kameru na příjezdové trase.',req:['camera','telecom'],gives:'gate'},{id:'alibiEva',title:'Nezávisle ověřit alibi manželky',desc:'Nezůstávej jen u výpovědi příbuzné. Zajisti časové údaje.',req:['eva1'],gives:'alibiEva'},{id:'alibiMarek',title:'Prověřit pracovní trasu správce',desc:'Modrá vlákna jsou podezřelá, ale nejprve ověř, kde správce skutečně byl.',req:['marek2'],gives:'alibiMarek'},{id:'warrant',title:'Požádat o prohlídku Králova vozidla',desc:'Vyžaduje konkrétní souběh záznamu vozu, finančního konfliktu a rozporu ve výpovědi.',req:['gate','ledger','kral5'],gives:'warrant'},{id:'dna',title:'Porovnat krev z auta s DNA oběti',desc:'Výsledek může podpořit či vyvrátit podezření. Bez zajištěné stopy není co analyzovat.',req:['warrant','autopsy'],gives:'dna'}];function operation(id){const o=OPERATIONS.find(x=>x.id===id);if(!o||S.operations.includes(id)||!o.req.every(has))return;S.operations.push(id);addEvidence(o.gives);save();render()}
function mapHtml(){const selected=PLACES.find(p=>p.id===S.location)||PLACES[0];return `<div class="eyebrow">ČESKÁ KRIMINÁLKA · REGION 01</div><h1>Mapa vyšetřování</h1><p class="muted">Skutečná jihočeská města, fiktivní kriminální případ. Klepni na bod na mapě, přečti si informace a vydej se na místo.</p><div class="map-canvas" role="group" aria-label="Stylizovaná mapa jižních Čech"><div class="map-lake lake-one"></div><div class="map-lake lake-two"></div><div class="map-road road-one"></div><div class="map-road road-two"></div><span class="map-watermark">JIŽNÍ ČECHY</span>${PLACES.map(p=>`<button class="map-pin ${p.id===S.location?'here':''} ${p.unlock()?'':'locked'}" style="left:${p.x}%;top:${p.y}%" onclick="choosePlace('${p.id}')" title="${p.name}" aria-label="${p.name}"><span>${p.unlock()?'●':'🔒'}</span><small>${p.name}</small></button>`).join('')}</div><div class="card"><div class="eyebrow">VYBRANÁ LOKALITA</div><h2>${selected.name}</h2><p class="muted">${selected.detail}</p><div class="tag">${selected.label}</div>${selected.unlock()?`${button(selected.id===S.location?'PROZKOUMAT LOKALITU':'CESTOVAT NA MÍSTO',`travel('${selected.id}')`,'primary wide')}`:'<div class="notice">Tato lokalita se odemkne postupem ve vyšetřování nebo v další epizodě.</div>'}</div><div class="card"><h3>Mapa republiky · budoucí regiony</h3>${REGIONS.map(r=>`<div class="region-row"><span>${r.name}</span><span class="tag ${r.status==='aktivní'?'new':''}">${r.status}</span></div>`).join('')}</div><div class="card"><h3>Deník přesunů</h3>${S.travelLog.length?S.travelLog.slice(-5).reverse().map(x=>`<p class="small muted">↳ ${x}</p>`).join(''):'<p class="muted small">Zatím jsi nikam necestoval.</p>'}</div><p class="foot">Mapa je herní schéma, nikoli přesná navigace. Lokality jsou přibližně rozmístěny; místa činu a zločiny jsou smyšlené.</p>`}
function choosePlace(id){S.location=id;save();render()}
function travel(id){let p=PLACES.find(x=>x.id===id);if(!p||!p.unlock())return;if(!S.visited.includes(id))S.visited.push(id);S.travelLog.push('Přesun: '+p.name);S.location=id;save();tab(p.action)}
function inspect(id){let x=E.find(e=>e.id===id);if(!x)return;addEvidence(id);alert(x.name+'\n\n'+x.desc)}function interview(id){if(!has(id)){S.interviews.push(id);save();toast('Výpověď zapsána');render()}}function test(id){let t=tests.find(x=>x.id===id);if(!t||S.labCredits<1||S.tests.includes(id)||!t.requires.every(has))return;S.labCredits--;S.tests.push(id);addEvidence(id);save();render()}function link(id){let l=links.find(x=>x.id===id);if(!l||!has(l.a)||!has(l.b)||has(id))return;S.links.push(id);if(S.links.length===3)S.labCredits+=2;save();toast('Souvislost propojena');render()}function saveNotes(){S.notes=document.getElementById('notes').value;save();toast('Poznámky uloženy')}
function submitVerdict(){let who=document.getElementById('accused').value,motive=document.getElementById('motive').value,proof=[...document.querySelectorAll('.proof:checked')].map(x=>x.value);if(!who||!motive||proof.length<2||proof.length>4){toast('Vyber osobu, motiv a 2–4 důkazy');return}if(!confirm('Opravdu uzavřít spis? Poté se odhalí řešení.'))return;S.accused=who;S.motive=motive;S.proof=proof;let strong=['dna','gate','ledger','draft'];const count=proof.filter(x=>strong.includes(x)).length;const solved=who==='kral'&&motive==='money'&&proof.includes('dna')&&proof.includes('gate')&&count>=3&&S.links.includes('blood');const score=(who==='kral'?20:0)+(motive==='money'?15:0)+(proof.includes('dna')?25:0)+(proof.includes('gate')?15:0)+(proof.includes('ledger')||proof.includes('draft')?10:0)+(S.links.includes('blood')?15:0);S.verdict={correct:solved,score:Math.min(100,score)};save();render()}
function verdictHtml(){let v=S.verdict;return `<div class="card ${v.correct?'success':'bad'}"><h2>${v.correct?'Případ uzavřen – správný závěr':'Závěr neobstál'}</h2><p>Vyšetřovací hodnocení: <b>${v.score}/100</b></p><p>${v.correct?'Závěr stojí na nezávislém záznamu vozidla, DNA oběti v autě, finančním motivu a rozporu ve výpovědi.':'Zvolená osoba, motiv nebo důkazní řetězec nebyly dostatečně podložené.'}</p></div><div class="card"><h2>Rekonstrukce případu</h2><div class="timeline"><div><b>21:48</b> – Tmavé auto přijíždí do oblasti chat.</div><div><b>22:14</b> – Telefonát oběti s Pavlem Králem.</div><div><b>22:20–22:30</b> – Konflikt kvůli podezřelé faktuře přerůstá ve fyzický útok.</div><div><b>22:27</b> – Hodinky se při zápasu pravděpodobně poškodí.</div><div><b>Po útoku</b> – Pachatel opouští objekt servisním vstupem.</div></div><p><b>Řešení scénáře:</b> Pavel Král zabil Martina Novotného při konfrontaci ohledně podvodného převodu. Přímý záznam útoku neexistuje. Klíčový je souběh čitelné SPZ, krve oběti v autě, popření kontaktu a finančního motivu. I v této fikci zůstává úkolem vyšetřování prověřit alternativní vysvětlení; hodnocení ve hře není soudní verdikt.</p></div>${button('Začít nový případ od začátku','resetCase()','wide')}`}
function resetCase(){if(confirm('Smazat postup a začít znovu?')){S=initial();save();render()}}render();
</script></body></html>
