function caseworkDone(){return CASEWORK.filter(c=>S.casework[c.id]?.done).length}
function caseworkStep(id,choice){let c=CASEWORK.find(x=>x.id===id);if(!c||!c.req.every(has))return;let state=S.casework[id]||{step:0,errors:0};let step=c.steps[state.step];if(!step)return;if(choice===step.a){state.step++;state.feedback=step.reason;if(state.step===c.steps.length){state.done=true;state.feedback=c.reward}}else{state.errors++;state.feedback='Závěr neobstál: '+step.reason+' Vrať se k podkladům a zkus to znovu.'}S.casework[id]=state;save();render()}
function caseworkPanel(){return '<div class="card"><div class="eyebrow">KRIMINALISTICKÉ SPISY · '+caseworkDone()+'/'+CASEWORK.length+' DOKONČENO</div><h2>Hloubkové vyšetřování</h2><p class="muted">Pět navazujících analýz. Každá vyžaduje několik souvisejících důkazů a tři rozhodnutí, která musí dávat smysl v kontextu případu.</p>'+CASEWORK.map(c=>{let st=S.casework[c.id]||{step:0,errors:0};let open=c.req.every(has);let step=c.steps[st.step];return '<div class="deduction"><h3>'+c.title+(st.done?' ✓':'')+'</h3><p>'+c.lead+'</p>'+(st.done?'<p class="verified">'+c.reward+'</p>':!open?'<p class="small muted">🔒 Chybí podklady: '+c.req.filter(x=>!has(x)).map(x=>evidence(x)?.name||x).join(', ')+'</p>':'<p class="eyebrow">KROK '+(st.step+1)+'/3</p><p><b>'+step.q+'</b></p>'+step.choices.map((v,i)=>btn(v,"caseworkStep('"+c.id+"',"+i+")",'full')).join('')+(st.feedback?'<p class="small muted">'+st.feedback+'</p>':''))+'</div>'}).join('')+'</div>'}

function submitTheory(id){let t=THEORIES.find(x=>x.id===id);if(!t||!t.req.every(has))return;let suspect=document.getElementById('suspect-'+id)?.value,proof=document.getElementById('proof-'+id)?.value;if(!suspect||!proof)return;let ok=suspect===t.correct&&proof===t.proof;let count=S.theories[id]?.attempts||0;S.theories[id]={correct:ok,attempts:count+1,feedback:ok?t.effect:'Závěr nebo zvolený důkaz není dostatečně podložený. Vrať se ke spisu.'};if(!ok&&t.flag)S.credibility[t.flag]=(S.credibility[t.flag]||0)-1;save();render()}

function analysis(){return caseworkPanel()+theoryPanel()+deductionPanel()+`<div class="eyebrow">ANALYTICKÁ TABULE</div><h1>Propoj souvislosti</h1><p class="muted">Důkazy nejsou automaticky propojené. Ověřuj rozpory a sestav vlastní hypotézu.</p>${LINKS.map(([id,a,b,title,result])=>`<div class="card"><h3>${title}</h3><p class="small muted">${has(id)?result:has(a)&&has(b)?'Máš oba podklady. Můžeš vyhodnotit jejich souvislost.':'Pro tuto hypotézu zatím chybí informace.'}</p><button class="btn full" ${!has(a)||!has(b)||has(id)?'disabled':''} onclick="connect('${id}')">${has(id)?'✓ Propojeno':'Vyhodnotit souvislost'}</button></div>`).join('')}${timelinePanel()}<div class="card"><h3>Vyšetřovací poznámky</h3><textarea id="notes" placeholder="Kdo měl motiv? Kdo lže? Co ještě ověřit?">${esc(S.notes)}</textarea>${btn('Uložit poznámky','saveNotes()','full')}</div>${btn('Připravit závěrečnou zprávu',"openVerdict()",'gold full')}`};const EVENTS=[['arrival','Příjezd neznámého vozu','camera'],['call','Telefonát s Králem','phone'],['conflict','Pravděpodobný střet v chatě','autopsy'],['departure','Odjezd Králova vozu','road']];function setTimeline(id){if(S.timeline.includes(id))S.timeline=S.timeline.filter(x=>x!==id);else S.timeline.push(id);save();render()}function timelinePanel(){let ordered=S.timeline.map(id=>EVENTS.find(x=>x[0]===id)).filter(Boolean);let valid=ordered.length===4&&ordered.map(x=>x[0]).join(',')==='arrival,call,conflict,departure';return '<div class="card"><div class="eyebrow">REKONSTRUKCE UDÁLOSTÍ</div><h2>Sestav časovou osu</h2><p class="muted">Vyber události ve správném pořadí. Pořadí musí odpovídat dostupným podkladům.</p><div class="timeline">'+(ordered.length?ordered.map((x,i)=>'<p><b>'+(i+1)+'.</b> '+x[1]+'</p>').join(''):'<p class="muted">Zatím prázdná osa</p>')+'</div>'+EVENTS.map(x=>'<button class="btn full" '+(!has(x[2])||S.timeline.includes(x[0])?'disabled':'')+' onclick="setTimeline(\''+x[0]+'\')">'+(has(x[2])?'＋ ':'🔒 ')+x[1]+'</button>').join('')+(ordered.length?btn('Vymazat pořadí','S.timeline=[];save();render()','full'):'')+(valid?'<p style="color:#a9d3b5">✓ Časová osa odpovídá podkladům.</p>':ordered.length===4?'<p style="color:#e3b6a8">Pořadí neodpovídá časovým údajům. Zkontroluj dokumenty.</p>':'')+'</div>'} function saveNotes(){S.notes=document.getElementById('notes').value;save();render()}function verdict(){if(S.verdict)return `<div class="eyebrow">UZAVŘENÝ SPIS</div><h1>${S.verdict.correct?'Správný závěr':'Nedostatečné podklady'}</h1><div class="card"><h2>Hodnocení ${S.verdict.score}/100</h2><p>Kvalita vyšetřovacích postupů: ${S.verdict.quality??100}/100 · Hloubkové analýzy: ${S.verdict.casework??0}/5</p><p>${S.verdict.correct?'Podařilo se ti propojit objektivní důkazy, výpovědi a motiv.':'Obvinění nebylo dostatečně podloženo.'}</p></div><div class="card"><h2>Rekonstrukce případu</h2><div class="timeline"><p><b>21:48</b> Tmavé auto přijíždí k chatám.</p><p><b>22:14</b> Martin telefonuje Pavlu Královi.</p><p><b>22:20–22:30</b> Spor o převod přerůstá v násilí.</p><p><b>22:39</b> Královo vozidlo zachycuje kamera u výjezdu.</p></div><p><b>Scénář:</b> Pachatelem je Pavel Král. Klíčové jsou krev oběti v jeho autě, nevysvětlené použití vozu a motiv související s oznámením finančního převodu. Přímý záznam útoku neexistuje.</p></div>${btn('Začít znovu','reset()','full')}`;return `<div class="eyebrow">ZÁVĚREČNÁ ZPRÁVA</div><h1>Uzavření případu</h1><div class="notice">Pozor: Odevzdáním zprávy se odhalí řešení. Nejdříve sestav časovou osu v Analýze. Nejprve prověř alternativní podezřelé.</div><div class="card"><h3>Koho obviňuješ?</h3><select id="who"><option value="">Vyber osobu</option>${PEOPLE.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><h3 style="margin-top:17px">Motiv</h3><select id="why"><option value="">Vyber motiv</option><option value="money">Zakrytí finančního podvodu</option><option value="divorce">Rozvodový spor</option><option value="revenge">Osobní pomsta</option><option value="theft">Loupež</option></select><h3 style="margin-top:17px">Podpůrné důkazy (2–4)</h3>${S.found.map(id=>`<label class="choice"><input type="checkbox" class="proof" value="${id}">${evidence(id).name}</label>`).join('')}${btn('Odevzdat zprávu','submitVerdict()','gold full')}</div>`}function submitVerdict(){if(caseworkDone()<4){alert('Nejdříve dokonči čtyři hloubkové analýzy.');go('board');return}if(allTheoryCount()<3){alert('Nejdříve obhaj tři hypotézy v Analýze.');go('board');return}if(DEDUCTIONS.filter(d=>S.deductions[d.id]).length<4){alert('Nejdříve ověř čtyři samostatné závěry v Analýze.');go('board');return}let who=document.getElementById('who').value,why=document.getElementById('why').value,proof=[...document.querySelectorAll('.proof:checked')].map(x=>x.value);if(!who||!why||proof.length<2||proof.length>4){alert('Vyber osobu, motiv a 2–4 důkazy.');return}if(!confirm('Opravdu uzavřít případ a odhalit řešení?'))return;let correct=who==='kral'&&why==='money'&&proof.includes('dna')&&proof.includes('road')&&(proof.includes('ledger')||proof.includes('letter'))&&S.links.includes('dnaLink');let score=(who==='kral'?20:0)+(why==='money'?15:0)+(proof.includes('dna')?25:0)+(proof.includes('road')?15:0)+(proof.includes('ledger')||proof.includes('letter')?10:0)+(S.links.includes('dnaLink')?15:0);let quality=Math.max(0,100-CASEWORK.reduce((n,c)=>n+(S.casework[c.id]?.errors||0),0)*3);S.verdict={correct,score,quality,chapters:Object.keys(S.choices).length,casework:caseworkDone()};save();render()}function reset(){if(confirm('Smazat postup a začít znovu?')){S=initial();save();go('home')}}

function chooseStory(id,choice){const ch=CHAPTERS.find(c=>c.id===id),opt=ch?.options.find(o=>o[1]===choice);if(!opt||!storyUnlocked(ch))return;S.choices[id]=choice;if(['blame','confront','fiber','instant','plate'].includes(choice)){let who=choice==='blame'?'eva':choice==='fiber'?'marek':'kral';S.credibility[who]=(S.credibility[who]||0)-1}save();modal('<div class="eyebrow">DŮSLEDEK ROZHODNUTÍ</div><h2>'+ch.title+'</h2><p>'+opt[2]+'</p>'+btn('Pokračovat','closeModal();render()','gold full'));render()}

{title:'Noční směna',text:'Sobota 06:10. Recepční Klára Švecová nenastoupila na předání směny. Její kabelka zůstala pod pultem, telefon je vypnutý. Provozní Daniel Vlk tvrdí, že ji viděl odcházet ve 02:05. Záznam vstupních dveří ale ukazuje poslední otevření ve 01:47.',question:'Který údaj máš ověřit jako první?',options:['Ověřit přesnost hodin vstupního systému','Obvinit provozního ze lži','Považovat telefon za důkaz únosu'],correct:0,clue:'Systém vstupních dveří se zpožďuje o 18 minut. Záznam 01:47 tedy odpovídá skutečnému času 02:05.',code:'02:05',ask:'V kolik hodin ve skutečnosti došlo k poslednímu otevření dveří?'},
{title:'Dvojí rezervace',text:'V hotelovém systému je pokoj 308 veden na Adama Růžičku. Papírový registrační lístek však nese jméno Petr Vacek. Obě rezervace byly založeny stejnou minutou, jedna z recepce a druhá ze správcovského účtu provozního.',question:'Co je pro další vyšetřování nejcennější?',options:['Zajistit auditní log změn rezervací','Předpokládat, že host používá falešné jméno','Prohledat všechny pokoje bez souvislosti'],correct:0,clue:'Audit ukazuje, že provozní ve 23:56 přepsal jméno hosta z Petra Vacka na Adama Růžičku. Důvod změny nezadal.',code:'23:56',ask:'V kolik hodin bylo jméno hosta přepsáno?'},
{title:'Pokoj zamčený zevnitř',text:'Zámek pokoje 308 má elektronickou historii. V 00:41 byl použit servisní klíč, ve 01:12 hostovská karta a ve 02:09 nouzové otevření. Pokojská Iveta přiznává, že nouzové otevření provedla na příkaz provozního.',question:'Jaký závěr vyplývá z elektronického zámku?',options:['Pokoj nemohl nikdo opustit','Někdo se do pokoje dostal servisním klíčem','Host musel být v pokoji v 02:09'],correct:1,clue:'Servisní klíč v 00:41 patřil provoznímu Danielu Vlkovi. Zámek sám neprokazuje, kdo byl uvnitř.',code:'00:41',ask:'V kolik hodin byl použit servisní klíč?'},
{title:'Záznam z prádelny',text:'V prádelně je kamera, která neukazuje tváře. Ve 02:18 zachytila osobu v hotelové uniformě s velkým kufrem. V seznamu zaměstnanců jsou dvě stejné uniformy. Klářina uniforma zůstala v šatně; Iveta má svou na sobě.',question:'Jak správně vyhodnotit kamerový záznam?',options:['Kufr dokazuje ukrytí těla','Uniforma jednoznačně označuje Ivetu','Porovnat čas a přístupové karty do prádelny'],correct:2,clue:'Ve 02:16 byla do prádelny použita karta provozního. Iveta v tu dobu odbavovala dodávku prádla u zadní rampy.',code:'02:16',ask:'V kolik hodin byla použita karta provozního do prádelny?'},
{title:'Zpráva, která neodešla',text:'V konceptu Klářina e-mailu stojí: „Našla jsem, kdo mění identity hostů. V pondělí to předám policii.“ Zároveň existuje záloha jejího telefonu s fotografií účetního výpisu. Provozní vybíral platby za fiktivní pobyty. Klára se ukryla u kamarádky poté, co jí Vlk vyhrožoval. Policii se ozvala až po zveřejnění pátrání.',question:'Jaký závěr nejlépe odpovídá důkazům?',options:['Klára byla zavražděna v pokoji 308','Provozní kryl účetní podvod a Kláře vyhrožoval','Pokojská unesla Kláru kvůli kufru'],correct:1,clue:'Klára je naživu. Zmizela ze strachu po výhrůžkách. Provozní manipuloval rezervacemi a snažil se zakrýt podvod.',code:'vlk',ask:'Napiš příjmení osoby, která manipulovala rezervacemi.'}
]},
{id:'gallery',number:'003',title:'Poslední aukce',place:'Praha',genre:'Krádež · umění · pojistný podvod',intro:'Z uzamčeného depozitáře galerie zmizel obraz za miliony. V noci se nespustil alarm. Ředitel tvrdí, že šlo o profesionální krádež, restaurátorka však upozorňuje na podivnou záměnu rámu.',people:['Richard Beneš – ředitel galerie','Tereza Holá – restaurátorka','Viktor Šimek – bezpečnostní technik','Nina Jelínková – kurátorka'],chapters:[
{title:'Tiché zabezpečení',text:'V 07:35 kurátorka zjistí, že obraz z depozitáře zmizel. Dveře nejsou poškozené. Alarm hlásí „údržbový režim“ od 23:10 do 23:42. Bezpečnostní technik Šimek tvrdí, že systém aktualizoval na žádost vedení.',question:'Co musíš zajistit?',options:['Seznam přístupů a žádost o údržbu','Ihned obvinit technika','Vypnout celý kamerový systém'],correct:0,clue:'Žádost o údržbu byla odeslána z účtu ředitele v 22:54. Technik jen provedl schválený zásah.',code:'22:54',ask:'V kolik hodin byla odeslána žádost o údržbu?'},
{title:'Rám bez obrazu',text:'Restaurátorka Tereza pozná, že rám zůstal původní, ale ochranná zadní deska byla vyměněna. Na vnitřní hraně je nový štítek s číslem 614. V depozitním katalogu je pod číslem 614 evidována kopie pro výstavu.',question:'Která hypotéza odpovídá stopám?',options:['Někdo mohl předem zaměnit originál za kopii','Kopie musela být ukradena z ulice','Rám prokazuje přítomnost technika'],correct:0,clue:'Pod číslem 614 byla vedena výstavní kopie. Záměna mohla proběhnout před nocí údajné krádeže.',code:'614',ask:'Jaké katalogové číslo má výstavní kopie?'},
{title:'Dvě pojistky',text:'Galerie pojistila originál na 12 milionů Kč. Tři týdny před krádeží ředitel požádal o navýšení na 18 milionů. V účetnictví zároveň chybí platba významnému věřiteli. Ředitel odmítá komentovat finanční situaci.',question:'Jaký závěr lze podložit?',options:['Navýšení pojistky samo dokazuje podvod','Finanční tlak a navýšení pojistky vytvářejí možný motiv','Restaurátorka se musela podílet na záměně'],correct:1,clue:'Pojistná hodnota byla navýšena na 18 milionů Kč. Motiv ale musí být spojen s konkrétním jednáním.',code:'18000000',ask:'Na kolik korun byla pojistka navýšena?'},
{title:'Přepravní kniha',text:'Kniha přeprav uvádí vývoz „reprodukce pro fotografování“ ve čtvrtek v 16:20, dva dny před krádeží. Přepravu podepsal ředitel Beneš. Dodávka jela do soukromého skladu, který galerie běžně nepoužívá.',question:'Co ověřit jako další?',options:['Zda sklad převzal originál, nikoliv kopii','Považovat podpis za přímý důkaz pojistného podvodu','Zatknout řidiče bez výslechu'],correct:0,clue:'Ve skladu byla nalezena přepravní bedna s původní plombou obrazu. Evidovaná „reprodukce“ byla ve skutečnosti originál.',code:'16:20',ask:'V kolik hodin byl obraz vyvezen z galerie?'},
{title:'Aukce, která neproběhla',text:'V soukromém skladu je originál. Beneš přiznává, že plánoval nahlásit jeho krádež a inkasovat pojistné plnění. Technik ani restaurátorka o plánu nevěděli. Údajná noční krádež byla inscenovaná.',question:'Která verze nejlépe vysvětluje všechny stopy?',options:['Technik ukradl obraz během aktualizace','Ředitel předem ukryl originál a fingoval krádež','Kurátorka zaměnila rám kvůli výstavě'],correct:1,clue:'Originál byl ukryt ještě před nahlášením krádeže. Ředitel manipuloval pojistkou i přepravními doklady.',code:'benes',ask:'Napiš příjmení osoby, která fingovala krádež.'}
]},
{"id":"train","number":"004","title":"Poslední spoj","place":"Tábor","genre":"Zmizení · železnice · vydírání","intro":"Průvodčí zmizel po posledním večerním vlaku. Jeho služební telefon leží v uzamčené skříňce, ale kamera zachytila muže v jeho bundě na nástupišti.","people":["Tomáš Rada – pohřešovaný průvodčí","Roman Kříž – dispečer","Anna Rybová – staniční pokladní","Filip Havel – pracovník údržby"],"chapters":[{"title":"Prázdné kupé","text":"Vlak přijel ve 22:18. Kamera ukazuje osobu v bundě průvodčího až ve 22:31, zatímco Tomášův čip naposledy otevřel služební místnost ve 22:09.","question":"Co ověřit jako první?","options":["Porovnat čas kamery s dispečerským záznamem","Obvinit pokladní z únosu","Považovat bundu za důkaz totožnosti"],"correct":0,"clue":"Kamera předbíhá skutečný čas o sedm minut. Záběr označený 22:31 vznikl ve 22:24.","code":"22:24","ask":"Jaký je skutečný čas záběru?"},{"title":"Ztracená směna","text":"Tomášův služební rozpis byl upraven po jeho zmizení. Ve výpisu změn je uveden účet dispečera Kříže.","question":"Který postup odliší omyl od manipulace?","options":["Vyslechnout pouze dispečera","Zajistit historii změn rozpisu","Zadržet údržbáře"],"correct":1,"clue":"Změna rozpisu proběhla ve 23:06, tedy po skončení směny.","code":"23:06","ask":"V kolik hodin došlo ke změně?"},{"title":"Záznam z depa","text":"Údržbář tvrdí, že u depa viděl modrou dodávku. GPS vozidla ukazuje zastávku na 14 minut, ale svědek si není jistý řidičem.","question":"Co lze bezpečně doložit?","options":["Dodávka prokazuje únos","Údržbář je pachatel","Ověřit GPS a knihu vjezdů"],"correct":2,"clue":"Kniha vjezdů eviduje dodávku s registrační značkou 7C2 1846.","code":"7c21846","ask":"Jaká registrační značka je v knize vjezdů?"},{"title":"Dvojí jízdenka","text":"Ve služební pokladně jsou dvě storna téže skupinové jízdenky. Číslo transakce se opakuje ve výpisu soukromého účtu dispečera.","question":"Jak pokračovat?","options":["Porovnat platby s auditní stopou pokladny","Obvinit všechny cestující","Ignorovat storna"],"correct":0,"clue":"Sporná transakce má identifikátor 4812. Dispečer přesměrovával vrácené platby.","code":"4812","ask":"Jaký je identifikátor transakce?"},{"title":"Světlo v čekárně","text":"Tomáš se přihlásil policii. Ukryl se po výhrůžkách, když odhalil přesměrování refundací. Dispečer změnil rozpis, aby zpochybnil jeho výpověď.","question":"Která rekonstrukce odpovídá zjištěním?","options":["Údržbář unesl průvodčího","Pokladní falšovala všechny jízdenky","Dispečer kryl podvod a zastrašoval svědka"],"correct":2,"clue":"Tomáš žije. Manipulaci s rozpisem i platbami organizoval Roman Kříž.","code":"kriz","ask":"Napiš příjmení osoby odpovědné za manipulaci."}]},{"id":"clinic","number":"005","title":"Bílá stopa","place":"Brno","genre":"Sabotáž · klinika · falešné obvinění","intro":"Na soukromé klinice někdo vyměnil vzorky před důležitým testem. Lékařka čelí obvinění, ale noční přístupové záznamy a laboratorní protokoly si odporují.","people":["MUDr. Eliška Veselá – vedoucí laboratoře","Petr Malina – správce systému","Dana Černá – laborantka","Milan Švec – ředitel kliniky"],"chapters":[{"title":"Přerušený řetězec","text":"Vzorek A17 byl zapsán v lednici ve 21:14. Kamera však ukazuje laborantku u dveří až ve 21:27. Systém kamery má jinou časovou zónu.","question":"Co je třeba ověřit?","options":["Okamžitě obvinit laborantku","Synchronizovat čas obou systémů","Zničit chybný záznam"],"correct":1,"clue":"Po korekci časů odpovídá záběr okamžiku 21:14.","code":"21:14","ask":"Jaký je opravený čas přístupu?"},{"title":"Neviditelný podpis","text":"V protokolu je elektronický podpis lékařky, přestože byla v tu dobu na konferenci. Systém umožňuje administrátorské zastoupení.","question":"Co prokáže původ podpisu?","options":["Auditní log zastoupení","Pouhá podoba podpisu","Domněnka, že lékařka lže"],"correct":0,"clue":"Podpis byl vložen administrátorským účtem v 22:46.","code":"22:46","ask":"V kolik hodin byl podpis vložen?"},{"title":"Dvě zkumavky","text":"Na štítcích A17 a A71 je stejná šarže tiskové pásky. Sklad vydal novou pásku pouze správci systému.","question":"Jakou stopu prověřit?","options":["Zatknout laborantku","Vyřadit oba vzorky bez dokumentace","Porovnat výdej pásky a historii tisku"],"correct":2,"clue":"Tiskárna zaznamenala druhý tisk štítku A17 v 23:12.","code":"23:12","ask":"V kolik hodin byl štítek znovu vytištěn?"},{"title":"Ztracený záložní soubor","text":"Záloha laboratorních výsledků byla ručně přesunuta. Přístup měl správce i ředitel. Soubor obsahuje původní nezměněné hodnoty.","question":"Jak zajistit průkazný důkaz?","options":["Získat hash a historii přístupu k záloze","Spoléhat jen na ústní výpověď","Smazat staré kopie"],"correct":0,"clue":"Kontrolní protokol zálohy má identifikátor L-204.","code":"l204","ask":"Jaký identifikátor má kontrolní protokol?"},{"title":"Motiv v dodatku","text":"Ředitel chtěl získat investora a zatajil neúspěšnou sérii testů. Správci nařídil upravit záznamy a následně obvinil lékařku.","question":"Kdo řídil manipulaci?","options":["Vedoucí laboratoře","Ředitel kliniky","Náhodný pacient"],"correct":1,"clue":"Důkazy spojují pokyn k manipulaci s ředitelem Milanem Švecem.","code":"svec","ask":"Napiš příjmení osoby, která manipulaci nařídila."}]}

function branchData(c,st){st.branches ||= {};st.alternative ||= {};return BRANCH_SCENES[c.id][st.step]}

function consequenceState(st){st.consequences ||= {};return st.consequences}
function consequencePanel(c,st){let ev=consequenceState(st)[st.step];if(!ev)return '';let b=BRANCH_SCENES[c.id]?.[st.step];return '<div class="card"><div class="eyebrow">NÁSLEDEK PŘEDCHOZÍHO ROZHODNUTÍ</div><h2>'+(ev==='witness'?'Svědek odmítá spolupracovat':'Zpochybněná důkazní stopa')+'</h2><p>'+(ev==='witness'?'Zpráva o předchozím nátlaku se rozšířila. '+(b?.person||'Svědek')+' odmítá přímý rozhovor. Musíš získat nezávislý podklad.':'Unáhlené prověření v předchozí kapitole zpochybnilo návaznost záznamů. Před dalším výslechem ověř jejich původ.')+'</p>'+(st.consequenceResolved?.[st.step]?'<p class="verified">✓ Náhradní podklad byl zajištěn. Výpověď už ale nelze obnovit.</p>':btn(ev==='witness'?'Vyžádat nezávislý záznam':'Ověřit původní protokol','resolveConsequence()','gold full'))+'</div>'}
function resolveConsequence(){let st=fieldState(extraState(ACTIVE_EXTRA)),n=st.step;if(!consequenceState(st)[n]||st.consequenceResolved?.[n])return;st.consequenceResolved ||= {};st.consequenceResolved[n]=true;st.caseLog.push('Kapitola '+(n+1)+': náhradní nezávislý podklad zajištěn po následcích předchozího rozhodnutí.');saveExtra();render()}
function chooseApproach(mode){let c=EXTRA_CASES.find(x=>x.id===ACTIVE_EXTRA),st=fieldState(extraState(c.id)),ch=st.step;if(st.branches?.[ch]||st.finished||(consequenceState(st)[ch]&&!st.consequenceResolved?.[ch]))return;branchData(c,st);st.branches[ch]=mode;let b=branchData(c,st);st.caseLog.push('Postup vůči '+b.person+': '+(mode==='careful'?b.friendly:b.hostile));if(mode==='pressure'){st.reputation=Math.max(0,st.reputation-2);st.mistakes++;if(ch+1<c.chapters.length)consequenceState(st)[ch+1]='witness'}saveExtra();render()}
function alternativeEvidence(){let c=EXTRA_CASES.find(x=>x.id===ACTIVE_EXTRA),st=fieldState(extraState(c.id)),b=branchData(c,st),ch=st.step;if(st.branches[ch]!=='pressure'||st.alternative[ch])return;st.alternative[ch]=true;st.caseLog.push(b.alternative+' '+b.result);saveExtra();render()}
function approachPanel(c,st){let b=branchData(c,st),mode=st.branches[st.step];return '<div class="card"><div class="eyebrow">ROZHODNUTÍ S DŮSLEDKY</div><h2>Jak budeš postupovat vůči '+b.person+'?</h2>'+(mode?'<p>'+(mode==='careful'?b.friendly:b.hostile)+'</p>': '<p>Volba ovlivní dostupnost svědecké výpovědi a další způsob získávání důkazů.</p>'+btn('Vést diskrétní rozhovor','chooseApproach(\'careful\')','gold full')+btn('Vyvinout nátlak a okamžitě obvinit','chooseApproach(\'pressure\')','full'))+(mode==='pressure'?(st.alternative[st.step]?'<p class="verified">✓ '+b.result+'</p>':'<p class="muted">Původní svědecká cesta je uzavřena. Musíš získat nezávislý důkaz.</p>'+btn(b.alternative,'alternativeEvidence()','gold full')):'')+'</div>'}
function fieldAction(idx){let c=EXTRA_CASES.find(x=>x.id===ACTIVE_EXTRA),st=fieldState(extraState(c.id));if(st.finished||st.detour)return;let ch=st.step,k=ch+'_'+idx;branchData(c,st);if(!st.branches[ch]||(consequenceState(st)[ch]&&!st.consequenceResolved?.[ch])||(idx===0&&st.branches[ch]==='pressure'&&!st.alternative[ch]))return;if(st.fieldwork[k])return;let item=FIELDWORK[c.id][ch][idx];st.fieldwork[k]=true;st.caseLog.push(item[0]+': '+(idx===0&&st.branches[ch]==='pressure'?BRANCH_SCENES[c.id][ch].result:item[1]));if(idx===2){st.reputation=Math.max(0,st.reputation-1);st.mistakes++;if(ch+1<c.chapters.length&&!consequenceState(st)[ch+1])consequenceState(st)[ch+1]='trace'}else st.reputation=Math.min(5,st.reputation+1);saveExtra();render()}
function fieldCount(st,step){return [0,1,2].filter(i=>st.fieldwork?.[step+'_'+i]).length}

function investScene(c,s,clues){let m=INVEST_META[c.id],d=INVEST_DRAMA[c.id],n=s.place,seen=clues.filter(x=>x.n===n),found=seen.filter(x=>s.found.includes(x.id)),stage=s.sceneStage?.[n]||0;return '<div class="card"><div class="eyebrow">LOKACE '+(n+1)+' / 5 · '+m.places[n]+'</div><h2>'+m.places[n]+'</h2>'+casePhoto(c.id,n)+'<p style="line-height:1.8">'+d.intro[n]+'</p><p class="small muted">Zajištěné podklady na místě: '+found.length+'/3</p>'+(stage===0?'<p>Co prověříš jako první?</p>'+btn('Prohlédnout prostředí',"investAction('scene','inspect')",'gold full')+btn('Zkontrolovat dokumentaci',"investAction('scene','records')",'full'):stage===1?'<p>Na místě je '+(s.sceneChoice?.[n]==='inspect'?'předmět, který neodpovídá běžnému provozu.':'záznam s neobvyklým časovým údajem.')+' Který podklad zajistíš?</p>'+seen.slice(0,2).map(x=>btn(x.title,"investAction('find','"+x.id+"')",'full')).join('')+btn('Pokračovat v prohlídce',"investAction('scene','continue')",'gold full'):'<p class="verified">Prohlídka místa proběhla. Další podklady lze zajistit podle potřeby.</p>'+seen.map(x=>'<div class="lab-item">'+btn((s.found.includes(x.id)?'✓ ':'⌕ ')+x.title,"investAction('find','"+x.id+"')",'full')+(s.found.includes(x.id)?'<p>'+x.detail+'</p>':'')+'</div>').join(''))+'</div>'}
function investInterview(c,s,clues){let d=INVEST_DRAMA[c.id];return '<div class="card"><h2>Výslechy</h2><p>Nejdříve zjisti, co svědek ví. Při konfrontaci potřebuješ konkrétní stopu; bez ní může rozhovor skončit.</p></div>'+INVEST_META[c.id].people.map((name,i)=>{let v=s.talk[i],dialog=d.dialogue[i],hasEvidence=s.found.includes(i+'_0')||s.found.includes(i+'_1');return '<div class="card"><div class="eyebrow">ROZHOVOR '+(i+1)+'/3</div><h3>'+name+'</h3>'+(v?'<p class="'+(v==='pressure'?'muted':'verified')+'">'+(v==='pressure'?'„Končím. Bez právníka už neřeknu nic.“':v==='document'?'„Dobře, tohle je původní záznam. Nechtěl jsem ho ukazovat před ostatními.“':'„Viděl jsem nesrovnalost, ale neznám celý příběh.“')+'</p>'+(v==='document'?'<p>'+clues.find(x=>x.id===i+'_1').detail+'</p>':''):dialog.map((q,j)=>btn(q,"investAction('dialog','"+i+":"+j+"')",j===1?'gold full':'full')).join('')+(hasEvidence?'<p class="small muted">Máš podklad, kterým můžeš výpověď ověřit.</p>':'<p class="small muted">Konfrontace bez podkladů může svědka umlčet. Nejdříve můžeš prozkoumat místa.</p>'))+'</div>'}).join('')}

function investAction(action,val){let c=EXTRA_CASES.find(x=>x.id===ACTIVE_EXTRA),s=investState();if(s.accused&&action!=='restart'&&action!=='tab')return;

function investResolution(c,s,g){let r=INVEST_RESOLUTIONS[c.id],title={full:'ÚPLNÉ OBJASNĚNÍ',partial:'ČÁSTEČNÉ OBJASNĚNÍ',wrong:'CHYBNÝ ZÁVĚR'}[g.result];let accused=s.accused==='main'?INVEST_META[c.id].who:s.accused==='other'?INVEST_META[c.id].other:'nikdo';let verified=s.found.filter(x=>x.endsWith('_0')||x.endsWith('_1'));let detail=g.result==='full'?'Podařilo se propojit klíčové důkazy s ověřenými výpověďmi. Závěr má oporu v zajištěných podkladech.':g.result==='partial'?'Hlavní podezření odpovídá nalezeným stopám, ale důkazní řetězec není úplný. '+(g.pressure?'Nátlak při '+g.pressure+' výslechu/výslechách připravil vyšetřování o nezávislou spolupráci svědka. ':'')+(g.good<3?'Některé hypotézy zůstaly neověřené. ':'')+(g.found<8?'Některé zásadní podklady nebyly zajištěny. ':'')+'Proto není možné všechny okolnosti uzavřít s jistotou.':'Rozhodl ses '+(s.accused==='none'?'neobvinit nikoho.':'obvinit osobu '+accused+'.')+' Toto rozhodnutí neodpovídá dostatečně zajištěným důkazům. Skutečné podezření směřuje jinam a případ zůstává neobjasněný.';return '<div class="card"><div class="eyebrow">ZÁVĚREČNÁ ZPRÁVA · '+title+'</div><h2>Co se skutečně stalo</h2><p>'+r.event+'</p><h3>Kdo za tím stál</h3><p>'+r.culprit+'</p><h3>Motiv</h3><p>'+r.motive+'</p><h3>Co dokládají stopy</h3><p>'+r.proof+'</p><p class="small muted">Zajištěné klíčové podklady: '+verified.length+'/10 · Podložené hypotézy: '+g.good+'/3 · Ověřené výpovědi: '+g.documents+'</p><h3>Co znamená tvůj závěr</h3><p>'+detail+'</p><h3>Co nelze tvrdit</h3><p>'+r.innocent+'</p><h3>Co zůstává otevřené</h3><p>'+r.remaining+'</p></div>'}

return h+'<details class="card"><summary>Možnosti vyšetřování</summary>'+btn('Začít znovu',"investAction('restart','')",'full')+btn('Původní příběhový režim','investToggle()','full')+'</details>'+btn('Knihovna případů','showLibrary()','full')}
function investToggle(){let st=extraState(ACTIVE_EXTRA);st.investEnabled=!st.investEnabled;saveExtra();render()}
function extraRender(){if(INVEST_META[ACTIVE_EXTRA]&&extraState(ACTIVE_EXTRA).investEnabled!==false)return investRender();if(ACTIVE_EXTRA==='hotel'&&extraState('hotel').freeEnabled)return hotelFreeRender();let c=EXTRA_CASES.find(x=>x.id===ACTIVE_EXTRA),st=extraState(c.id);if(st.step>=c.chapters.length)st.finished=true;let ch=c.chapters[st.step],a=st.answers[st.step]||{};fieldState(st);let detour=st.detour,det=detour?(DETOURS[c.id]?.[st.step]||['Prověřování slepé stopy','Tato hypotéza neodpovídá dosavadním důkazům. Vyšetřovací tým prověřuje nezávislé záznamy.','Porovnat dostupné protokoly','Kontrola neprokázala podezření. Můžeš se vrátit k ostatním stopám.']):null;let ending=st.reputation<=1?'Případ uzavřen s poškozenou důvěrou svědků':st.mistakes===0?'Precizní vyšetřování':st.mistakes<=2?'Případ vyřešen s komplikacemi':'Případ vyřešen, ale s procesními chybami';return '<div class="eyebrow">PŘÍPAD '+c.number+' · '+c.place+'</div><div class="case-hero-photo">'+casePhoto(c.id,Math.min(st.step,c.chapters.length-1))+'</div><h1>'+c.title+'</h1><p>'+c.intro+'</p>'+caseTimeline(c,st)+'<div class="card"><div class="eyebrow">SPIS · '+Math.min(st.step+1,c.chapters.length)+'/'+c.chapters.length+'</div><p class="small muted">Osoby: '+c.people.join(' · ')+'</p><p class="small muted">Prověřené slepé stopy: '+(st.detoursDone||0)+' · Chybná rozhodnutí: '+st.mistakes+'</p></div>'+(st.finished?chapterReview(c,st):detour?'<div class="card"><div class="eyebrow">VEDLEJŠÍ VYŠETŘOVACÍ VĚTEV</div><h2>'+det[0]+'</h2><p style="line-height:1.8">'+(detour.phase===0?det[1]:det[3])+'</p>'+btn(detour.phase===0?det[2]:'Vrátit se k hlavnímu vyšetřování','extraDetourNext()','gold full')+'<p class="small muted">Tento postup spotřeboval čas a změnil záznam vyšetřování. Bez jeho prověření nelze pokračovat.</p></div>':consequencePanel(c,st)+branchEvent(c,st)+sceneDetails(c,st)+comparePanel(c,st)+((consequenceState(st)[st.step]&&!st.consequenceResolved?.[st.step])?'':approachPanel(c,st))+(st.branches?.[st.step]&&(st.branches[st.step]!=='pressure'||st.alternative?.[st.step])?fieldPanel(c,st)+chapterEvidence(c,st):'')+'<div class="card"><div class="eyebrow">KAPITOLA '+(st.step+1)+'</div><h2>'+ch.title+'</h2><p style="line-height:1.8">'+ch.text+'</p><h3>'+ch.question+'</h3>'+(a.solved?'<p class="verified">✓ Postup ověřen.</p>':(!st.branches?.[st.step]||(st.branches[st.step]==='pressure'&&!st.alternative?.[st.step])||fieldCount(st,st.step)<2||a.evidence===undefined)?'<p class="muted">Nejdříve prověř alespoň dvě stopy a vyber podklad pro svůj závěr.</p>':ch.options.map((o,i)=>btn(o,"extraAnswer('"+c.id+"',"+i+")",'full')).join(''))+'</div>'+(a.solved?'<div class="card"><div class="eyebrow">ZAJIŠTĚNÁ STOPA</div><p>'+ch.clue+'</p><h3>Ověření protokolu</h3><p>'+ch.ask+'</p>'+(a.verified?'<p class="verified">✓ Údaj ověřen.</p>'+btn('Pokračovat v případu','extraNext()','gold full'):'<input id="extra-code" type="text" placeholder="Odpověď podle stopy" style="width:100%;padding:14px;background:#0b1419;color:white;border:1px solid #667"><p id="extra-feedback" class="small muted"></p>'+btn('Ověřit odpověď','extraVerify()','gold full'))+'</div>':'')+castPanel(c,st)+visualEvidence(c,st)+extraCaseLog(st)+'<div class="card"><h3>Pracovní poznámky</h3><textarea id="extra-notes" placeholder="Rozpory a podezření">'+esc(st.notes)+'</textarea>'+btn('Uložit poznámky','extraSaveNotes()','full')+'</div>')+extraHelp(c,st)+(c.id==='hotel'?btn('Samostatné vyšetřování','hotelFreeToggle()','gold full'):'')+btn('Zpět do knihovny','showLibrary()','full')}
function extraSaveNotes(){extraState(ACTIVE_EXTRA).notes=document.getElementById('extra-notes').value;saveExtra()}

]],S.tab)+(S.tab==='scene'?scene():S.tab==='people'?interviews():operations())}if(['evidence','lab'].includes(S.tab)){html=subnav([['evidence','Důkazy'],['lab','Laboratoř']],S.tab)+(S.tab==='evidence'?dossier():lab())}if(S.tab==='board')html=storyPanel()+analysis();if(S.tab==='verdict')html=verdict();if(S.tab==='home')html+=btn('Další případy · Knihovna', 'showLibrary()', 'full');document.getElementById('app').innerHTML=html;document.getElementById('progress').textContent=[...new Set(S.found)].length+' / '+E.length+' STOP';document.getElementById('nav').innerHTML=[['map','◉','Mapa'],['scene','⌕','Vyšetřování'],['evidence','▤','Spis'],['board','◇','Analýza']].map(([id,ic,label])=>`<button class="${(id==='scene'&&['scene','people','operations'].includes(S.tab))||(id==='evidence'&&['evidence','lab','verdict'].includes(S.tab))||(id==='board'&&S.tab==='board')||(id==='map'&&['map','home'].includes(S.tab))?'active':''}" onclick="go('${id}')"><b>${ic}</b>${label}</button>`).join('')}try{ACTIVE_EXTRA='library';render()}catch(err){document.getElementById('app').innerHTML='<div class="card"><h2>Hru se nepodařilo spustit</h2><p>Chyba: '+String(err.message||err)+'</p><button class="btn full" onclick="localStorage.removeItem(\'casezero_anthology_v1\');location.reload()">Opravit uložený postup</button></div>';console.error(err)}
</script></body></html>
